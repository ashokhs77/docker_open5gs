# -------------------------  request routing logic -------------------
# main routing logic

route{
#!ifdef WITH_DEBUG
	xlog("I-CSCF >>>>>>>>>>>>>>>>>>>> $rm $ru ($fu => $tu ($si:$sp) to $tu, $ci)\n");
#!endif

#	if !($rU =~ "\+.*") {
#		prefix("+");
#	}
	
	if (has_totag()) {
        # this is an in-dialog request (BYE / re-INVITE / UPDATE / PRACK / INFO)
        if (loose_route()) {
            # forward within existing dialog
            t_relay();
            exit;
        } else {
            # dialog not found here, respond 481
            send_reply("481","Call Leg/Transaction Does Not Exist");
            exit;
        }
    }

	# per request initial checks
	route(REQINIT);

	if (is_method("REGISTER")) {
		route(register);
	}

	if (is_method("NOTIFY") && search("^(Event|o)([ \t]*):([ \t]*)reg")) {
		if (!t_relay()) {
			sl_reply_error();
		}
		exit;
	}

	if (is_method("INVITE|SUBSCRIBE|MESSAGE|INFO|PUBLISH|CANCEL")) {
		route(initial_request);
	} else {
		# Shouldn't get here unless missconfigured (add more methods as initial) or
		# somebody is routing unknown messages
		append_to_reply("Allow: INVITE,SUBSCRIBE,MESSAGE,INFO,PUBLISH,CANCEL\r\n");
		send_reply("406","Initial Request Method not allowed at the I-CSCF");
		break;
	}
}

######################################################################
# Helper routes (Basic-Checks, NAT-Handling/RTP-Control, XML-RPC)
######################################################################
# Per SIP request initial checks
route[REQINIT] {
	$var(used) = 1 - ($stat(free_size) / $stat(total_size));
	xlog("L_DBG", "Mem: Total $stat(total_size), Free $stat(free_size) [$var(used)% used]\n");
	if ($var(used) > 95) {
		send_reply("503", "Server overloaded");
		exit;
	}


	# Trace this message
#!ifdef CAPTURE_NODE
	sip_trace();
	setflag(FLT_CAPTURE);
#!endif
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483","Too Many Hops");
		exit;
	}
	if(!sanity_check("1511", "7")) {
		xlog("Malformed SIP message from $si:$sp\n");
		exit;
	}

	# Check for shutdown mode:
	if (!has_totag() && ($sel(cfg_get.system.shutdownmode) > 0)) {
		send_reply("503", "Server shutting down");
		exit;
	}

	# Reply to OPTIONS:
#	xlog("L_INFO", ">>> OPTIONS: R-URI=$ru, R-URI domain=$rd, From URI=$fu, From domain=$fd, Src IP=$si\n");
	if (is_method("OPTIONS") && (uri==myself)) {
		options_reply();
		exit;
	}

	# Ignore Re-Transmits:
	if (t_lookup_request()) {
		exit;
	}

	if (is_method("INVITE|REGISTER")) {
		send_reply("100", "Trying");
	}
}

######################################################################
# XMLRPC routing
######################################################################
#!ifdef WITH_XMLRPC
route[XMLRPC] {
	if ((method=="POST" || method=="GET")
#!ifdef XMLRPC_WHITELIST_1
&& ((src_ip == XMLRPC_WHITELIST_1)
#!ifdef XMLRPC_WHITELIST_2
 || (src_ip == XMLRPC_WHITELIST_2)
#!endif
#!ifdef XMLRPC_WHITELIST_3
 || (src_ip == XMLRPC_WHITELIST_3)
#!endif
)
#!endif
) {
		# close connection only for xmlrpclib user agents (there is a bug in
		# xmlrpclib: it waits for EOF before interpreting the response).
		if ($hdr(User-Agent) =~ "xmlrpclib")
			set_reply_close();
		set_reply_no_connect();
		dispatch_rpc();
		exit;
	}
	send_reply("403", "Forbidden");
	exit;
}
#!endif

######################################################################
# Handling of REGISTER requests
######################################################################
route[register]
{
	t_set_fr(5000, 5000);
	#first check if we have an S-CSCF list
	if (I_scscf_select("0")) {
		#there is an S-CSCF list - no need to do a UAR
		t_on_reply("register_reply");
		t_on_failure("register_failure");
		if (!t_relay()) {
			send_reply("500","Error forwarding towards S-CSCF");
		}
	} else {
		#no S-CSCF list therefore must do UAR
		#free this from the failed I_scscf_select call
		I_scscf_drop();
		# Do an asynchronous UAR:
		#0=REG/DEREG; 1=REG+Capabilities
		if (!I_perform_user_authorization_request("REG_UAR_REPLY","0")) {
			send_reply("500", "Error in Request");
		}
	}
	exit;
}

route[REG_UAR_REPLY]
{
	#xlog("$$avp(s:uaa_return_code) = $avp(s:uaa_return_code)\n");
	#this is async so to know status we have to check the reply avp
	switch ($avp(s:uaa_return_code)) {
		case 1: #success
			if (I_scscf_select("0")) {
				t_on_failure("register_failure");
				t_on_reply("register_reply");
				#now relay to appropriate SCSCF
				if (!t_relay()) {
					t_reply("500", "Error forwarding to SCSCF");
				}
			} else { #select failed
				I_scscf_drop();
				t_reply("500", "Server error on SCSCF Select (UAR)");
			}
			break;
		case -1: #failure
			xlog("L_ERR", "UAR failure - error response sent from module\n");
			break;
		case -2: #error
			xlog("L_ERR", "UAR error - sending error response now\n");
			t_reply("500", "UAR failed");
			break;
		default:
			xlog("L_ERR", "Unknown return code from UAR, value is [$avp(s:uaa_return_code)]\n");
			t_reply("500", "Unknown response code from UAR");
			break;
	}
}


######################################################################
# Replies to REGISTER requests,
######################################################################
onreply_route[register_reply]
{
	xlog("L_DBG", "Enter register reply block");
	if (!t_check_status("(408)|(480)")){
		if (!t_check_status("(401)")){
			xlog("L_DBG", "dropping scscf list on register failure");
			I_scscf_drop();
		} else {
			xlog("L_DBG", "This is a 401 - keep scscf list to do optimisation");
		}
	}
	break;
}

######################################################################
# Failed REGISTERs
######################################################################
failure_route[register_failure]
{
	if (t_branch_timeout() || t_check_status("([5-6][0-9][0-9])")){
		if (I_scscf_select("1")) {
			t_on_reply("register_reply");
			t_on_failure("register_failure");
			if (!t_relay()) {
				t_reply("500","Error forwarding towards next S-CSCF");
				break;
			}
			break;
		} else {
			t_reply("500", "Server error on UAR select next S-CSCF");
			break;
		}
	} else {
		if (!t_check_status("(401)")){
			xlog("L_DBG", "dropping scscf list on register failure");
			I_scscf_drop();
		} else {
			xlog("L_DBG", "This is a 401 - keep scscf list to do optimisation");
		}
		break;
	}
}

######################################################################
# Initial requests
######################################################################
route[initial_request]
{
#	$avp(prefix)="+";
#	$ru= $(ru{s.rm,$avp(prefix)});
	xlog("$$ru => $ru\n");

	# If request domain ($rd) is an IP address ? rewrite to IMS domain
        if ($rU =~ "^[0-9]+$" && $rd =~ "^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$") 
        {
                $ru = "sip:" + $rU + "@" + "NETWORKNAME";
                xlog("L_INFO: Rewrote numeric IP-based R-URI to IMPU: $ru\n");
        }

        xlog("L_INFO: Normalized R-URI = $ru\n");

	I_perform_location_information_request("LIR_REPLY", "0");
}

route[LIR_REPLY] {
	if ($avp(lia_return_code) == 1) {
		if (I_scscf_select("0")) {
			xlog("L_DBG", "ru = $ru, du = $du\n");
			t_on_reply("initial_request_reply");
			t_on_failure("initial_request_failure");
			if (!t_relay()) {
				t_reply("500","Error forwarding towards S-CSCF");
				break;
			}
			break;
		} else {
			xlog("L_DBG", "dropping scscf list on initial request");
			I_scscf_drop();
			t_reply("500", "Server error on LIR select S-CSCF");
			break;
		}
	} else {
		t_reply("500", "Server error on LIR");
		break;
	}
	break;
}

######################################################################
# Replies to initial requests
######################################################################
onreply_route[initial_request_reply]
{
	xlog("L_DBG", "Enter initial request request block");
	if (!t_check_status("(408)")){
		xlog("L_DBG", "dropping scscf list on initial request reply");
		I_scscf_drop();
	}
	break;
}

######################################################################
# Failed initial requests
######################################################################
failure_route[initial_request_failure]
{
	xlog("L_DBG", "Enter initial request failure block");
	if (t_check_status("(408)")){
		xlog("L_DBG", "Got a failure for initial request");
		if (I_scscf_select("1")) {
			t_on_reply("initial_request_reply");
			t_on_failure("initial_request_failure");
			if (!t_relay()) {
				t_reply("500","Error forwarding towards next S-CSCF");
				break;
			}
			break;
		} else {
			t_reply("500", "Server error on LIR select next S-CSCF");
			break;
		}
	} else {
		xlog("L_DBG", "dropping scscf list on  initial request failure");
		I_scscf_drop();
	}
	break;
}

#!ifdef PEERING
######################################################################
# HSS returned "User-Unknown" on LIR request
######################################################################
route[lir_term_user_unknown]
{
	# Check if this request already came from another I-CSCF fallback
        if($hdr(X-Fallback-Origin) == "yes") {
#                xlog("L_WARN", "[DISPATCHER] Received from another I-CSCF fallback, not retrying.\n");
                 if (!t_newtran()) {
                        sl_reply_error();
                        exit;
                }
		 t_reply("404", "User Unknown");
                exit;
         }
#	 xlog("L_INFO", "[USER_UNKNOWN] FALLBACK if $ru   $rd\n");
	if (uri =~ "tel:.*") {
		# Let's check, if the number can be found in ENUM:
		if(!enum_query()) {
			# ENUM failed, send it to the PSTN-Gateway:
			route(PSTN);
			break;
		}

		# ENUM resolved to another domain
		if ($rd != NETWORKNAME) {
			t_on_reply("initial_request_reply");
			t_on_failure("initial_request_failure");
			if (!t_relay()) {
				t_reply("500","Error forwarding to external domain");
				exit;
			}
			exit;
		} else {
			append_hf("X-Fallback-Origin: yes\r\n");  # mark as fallback
			route(DISPATCHER_FALLBACK);  # try other S-CSCFs dynamically
			exit;
		}
	} else {

		append_hf("X-Fallback-Origin: yes\r\n"); # mark as fallback

		if ($rU =~ "^4[0-9]+$") {
    			xlog("L_INFO", "[USER_UNKNOWN] Prefix 4 detected ($rU), routing to SIP server\n");

    			# Strip prefix 4
    			$rU = $(rU{re.subst,/^4//});
    			xlog("L_INFO", "[USER_UNKNOWN] Stripped prefix, forwarding as $rU\n");
    			route(DISPATCHER_SIPSERVER);
    			exit;
		}
		else {
   			# we received a request for our domain (non-tel), but HSS said "User Unknown"
    			route(DISPATCHER_FALLBACK);
    			exit;
		}
	}
}

######################################################################
#  Dispatcher fallback logic
######################################################################
route[DISPATCHER_FALLBACK] {
    xlog("L_INFO", "[DISPATCHER] Attempting fallback routing to S-CSCF for $ru\n");
    if (ds_select_dst("1", "4")) {
        if (is_myself("sip:" + $(du{uri.host}))) {
            xlog("L_WARN", "[DISPATCHER] Selected myself, skipping...\n");
            ds_mark_dst();
            if (!ds_next_dst()) {
                xlog("L_ERR", "[DISPATCHER] No valid fallback destinations left\n");
                send_reply("480", "No Available Destinations");
                exit;
            }
        }

	$ru = "sip:" + $rU + "@" + NETWORKNAME;
        xlog("L_INFO", "[DISPATCHER] Rewriting R-URI to $ru and routing\n");
        t_on_failure("DISPATCHER_FAILURE"); 
       
        # t_on_reply can still be initial_request_reply
        t_on_reply("initial_request_reply");
	
        if (!t_relay()) {
            xlog("L_ERR", "[DISPATCHER] Failed to relay via selected destination\n");
            send_reply("500", "Relay Failed");
            exit;
        }
        exit;
    } else {
        xlog("L_ERR", "[DISPATCHER] Dispatcher failed to select destination\n");
        send_reply("503", "Service Unavailable");
        exit;
    }
}


######################################################################
# DISPATCHER failure callback
######################################################################
failure_route[DISPATCHER_FAILURE] {
    xlog("L_WARN", "[DISPATCHER_FAILURE] Request to SIP server failed\n");

    # Try next SIP server in dispatcher list
    if (t_check_status("404|408")) {
	# Mark current destination as failed and move on
        ds_mark_dst();
	if (ds_next_dst()) {
		xlog("L_INFO", "[DISPATCHER_FAILURE] Trying next SIP server\n");
		$ru = "sip:" + $rU + "@" + NETWORKNAME;
			
		# Keep failure handling for further hops
		t_on_failure("DISPATCHER_FAILURE");
			
	        if (!t_relay()) {
                xlog("L_ERR", "[DISPATCHER_FAILURE] Immediate relay to next dst failed\n");
                t_reply("500", "Relay Failed");
                exit;
            	}
	} else {
		xlog("L_ERR", "[DISPATCHER_FAILURE] No more SIP server destinations available\n");
		t_reply("480", "No Available Destinations");
		exit;
	}
    }
}


######################################################################
# Dispatcher route for external SIP server (Kamailio)
######################################################################
route[DISPATCHER_SIPSERVER] {
    xlog("L_INFO", "[DISPATCHER_SIPSERVER] Attempting to forward $ru\n");

    if (ds_select_dst("2", "4")) {
        # Check if the selected destination is ourselves
        if (is_myself("sip:" + $(du{uri.host}))) {
            xlog("L_WARN", "[DISPATCHER_SIPSERVER] Selected myself, skipping...\n");
            ds_mark_dst();
            if (!ds_next_dst()) {
                xlog("L_ERR", "[DISPATCHER_SIPSERVER] No valid SIP server destinations left\n");
                send_reply("480", "No Available Destinations");
                exit;
            }
        }

        # Rewrite Request-URI to point to selected SIP server
        $ru = "sip:" + $rU + "@" + $(du{uri.host});
        xlog("L_INFO", "[DISPATCHER_SIPSERVER] Rewriting R-URI to $ru and relaying\n");

        # Transaction callbacks
        t_on_failure("SIPSERVER_FAILURE");

        if (!t_relay()) {
            xlog("L_ERR", "[DISPATCHER_SIPSERVER] Failed to relay via selected SIP server\n");
            send_reply("500", "Relay Failed");
            exit;
        }
        exit;
    } else {
        xlog("L_ERR", "[DISPATCHER_SIPSERVER] Dispatcher failed to select destination\n");
        send_reply("503", "Service Unavailable");
        exit;
    }
}

######################################################################
# SIP server failure callback
######################################################################
failure_route[SIPSERVER_FAILURE] {
    xlog("L_WARN", "[SIPSERVER_FAILURE] Request to SIP server failed\n");
    # Strip prefix 4 again if needed
    if ($rU =~ "^4[0-9]+$") {
    	$rU = $(rU{re.subst,/^4//});
    }
    # Try next SIP server in dispatcher list
    if (ds_next_dst()) {
        xlog("L_INFO", "[SIPSERVER_FAILURE] Trying next SIP server\n");
        $ru = "sip:" + $rU + "@" + $(du{uri.host});
	 xlog("L_INFO", "[SIPSERVER_FAILURE] Rewriting R-URI to $ru and relaying\n");
        t_on_failure("SIPSERVER_FAILURE");
        if (!t_relay()) {
            xlog("L_ERR", "[SIPSERVER_FAILURE] Failed to relay to next SIP server\n");
            send_reply("500", "Relay Failed");
            exit;
        }
    } else {
        xlog("L_ERR", "[SIPSERVER_FAILURE] No more SIP server destinations available\n");
        send_reply("480", "No Available Destinations");
        exit;
    }
}

######################################################################
# Send calls to the PSTN-Gateways:
######################################################################
route[PSTN]
{
	t_on_failure("PSTN_failure");
	# Relay the request towards the PSTN-Gateway:
	if (!ds_select_dst("1", "4")) {
		send_reply("503", "Service not available");
		exit;
	}
	# Relay the request:
	if (!t_relay()) {
		send_reply("503", "Service not available");
		exit;
	};
	exit;
}

######################################################################
# manage failure routing cases, perform failover
######################################################################
failure_route[PSTN_failure] {
	# Choose another gateway, in case we
	# - get a local generated "408"
	# - receive a 5xx or 6xx reply from the proxy.
	if (t_branch_timeout() || t_check_status("[5-6]..")) {
		if (ds_next_dst()) {
			# Do Failover in case problems:
			t_on_failure("PSTN_failure");
			# Relay the request:
			if (!t_relay()) {
				send_reply("503", "Service not available");
				exit;
			};
		} else {
			# Add a header, to indicate the phone should try again in 30 seconds.
			append_hf("Retry-After: 30\r\n");
			send_reply("503", "Service not available");
		}
		exit;
	}
}
#!endif

#!ifdef FALLBACK_AUTH
######################################################################
# HSS returned "User-Unknown" on UAR request,
# try to send it to any S-CSCF for authentication
######################################################################
route[uar_term_user_unknown]
{
	$rd = "scscf."+NETWORKNAME;
	t_on_reply("register_reply");
	t_on_failure("register_failure");
	if (!t_relay()) {
		t_reply("500","Error forwarding towards S-CSCF");
		break;
	}
	break;
}
#!endif
