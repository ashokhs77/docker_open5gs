#
# OpenSIPS-AS: in-path MMTel anchor (B2BUA, topology hiding) for the VoLTE merge-call
# feature. b2b_init_request("top hiding") gives the outgoing leg a FRESH Call-ID, so
# the S-CSCF sees two clean dialogs instead of one looping one (the old Kamailio-AS
# relay spiralled ims_dialog on in-dialog PRACK). Owning B's leg is also what lets
# the AS re-INVITE B into the FreeSWITCH conference with no new INVITE and no ring.
#
# ${OPENSIPS_IP} / ${IMS_DOMAIN} / ${SCSCF_IP} are substituted at boot by substenv.sh.
# Needs OpenSIPS 4.0: passthru_prack and custom_contact_header_params, absent in
# 3.6, are what keep VoLTE Contact feature tags and PRACK interworking intact.

####### Global Parameters #########
log_level=3
xlog_level=3
stderror_enabled=yes
syslog_enabled=no

# route[conf_req] blocks a worker per REFER (2 per merge, up to 2 s), so budget
# ~2 workers per simultaneous merge. 24 targets ~10 concurrent merges.
udp_workers=24
tcp_workers=2

auto_aliases=no
disable_dns_blacklist=yes

socket=udp:${OPENSIPS_IP}:5060
socket=tcp:${OPENSIPS_IP}:5060

# Recognise the iFC ServerName host as myself so loose_route() strips the Route that
# ims_isc inserts and follows the next one (the S-CSCF ODI return).
alias=udp:"opensips.${IMS_DOMAIN}":5060
alias=tcp:"opensips.${IMS_DOMAIN}":5060

####### Modules Section ########
# Source-install module path (set by opensips_init.sh for this build).
mpath="${OPENSIPS_MPATH}"

loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sipmsgops.so"
loadmodule "signaling.so"
loadmodule "uac.so"
loadmodule "b2b_entities.so"
loadmodule "b2b_logic.so"
# MI over FIFO + exec: the helper scripts fire MI at ourselves because script-level
# b2b_bridge() cannot act on ANOTHER tuple, and CANCEL needs the same route in.
loadmodule "mi_fifo.so"
loadmodule "exec.so"
modparam("mi_fifo", "fifo_name", "/tmp/opensips_fifo")

# DB-less for this stage (b2b sessions not persisted across restart -- fine here).
modparam("b2b_entities", "db_mode", 0)
modparam("b2b_logic",   "db_mode", 0)

# --- OpenSIPS 4.0 VoLTE-interworking parameters (the reason we moved off 3.6) ---
# Relay PRACK end-to-end so 100rel / 183-with-SDP / RFC 3312 preconditions negotiate
# between the real endpoints through the B2BUA.
modparam("b2b_entities", "passthru_prack", 1)
# Contact feature params carried across the B2BUA so the handset keeps its
# audio<->video upgrade button (matched literally, '+' included; the reply leg needs
# the Dockerfile sed-patch too). +sip.instance is EXCLUDED on purpose -- the B2BUA
# is not that UA instance, and copying it makes the S-CSCF log "malformed contact".
modparam("b2b_logic", "custom_contact_header_params",
	"+g.3gpp.icsi-ref;+g.3gpp.mid-call;+g.3gpp.srvcc-alerting;+g.3gpp.ps2cs-srvcc-orig-pre-alerting;video;audio;isfocus")

# b2b "top hiding" strips every P-* header, and losing P-Early-Media alone makes the
# callee skip the reliable-183 flow, so pass them all plus Accept/Accept-Contact.
modparam("b2b_logic", "custom_headers_regexp", "/^P-/i")
modparam("b2b_logic", "custom_headers", "Accept;Accept-Contact")

# Contact for b2b legs created without a triggering SIP message (the MI bridge on
# merge). Without it: "b2b_get_local_contact: 'server_address' not defined".
modparam("b2b_logic", "server_address", "sip:${OPENSIPS_IP}:5060")

modparam("rr", "append_fromtag", 0)
modparam("tm", "T1_timer", 1200)
modparam("tm", "T2_timer", 4000)
# We rewrite the To on the b2b client leg only; no reply-side restoration needed.
modparam("uac", "restore_mode", "none")

####### Routing Logic ########
route {

	if (!mf_process_maxfwd_header(10)) {
		send_reply(483, "Too Many Hops");
		exit;
	}

	# b2b_logic handles in-dialog requests internally (top hiding), so a to-tagged
	# request arriving here is not a b2b dialog -> best-effort loose route.
	if (has_totag()) {
		if (loose_route()) {
			t_relay();
			exit;
		}
		send_reply(404, "Not Here");
		exit;
	}

	# CANCEL (caller hung up before answer) is the one method b2b never claims: its
	# prescript accepts a request only if every Route hdr is its own, and the S-CSCF
	# always adds its ODI return hop -- "Second Route uri is not mine". t_relay() then
	# only clears the CALLER, because the callee-facing leg is a separate UAC
	# transaction, not a branch. So mi_cancel.sh must cancel the peer leg explicitly.
	# Upstream limitation, not a misconfiguration; there is no modparam for it.
	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			xlog("L_NOTICE", "OpenSIPS-AS: CANCEL ci=$ci from=$fU -- relaying, then cancelling the peer b2b leg\n");
			# Relay first: this 200s the CANCEL and 487s the caller at once, so nothing
			# retransmits while the blocking exec below holds this worker.
			t_relay();
			# Default BEFORE the call: $var() is per-PROCESS and survives between messages, so a
			# worker that once succeeded would otherwise report a stale "ok".
			$var(micancel) = "";
			exec("/mnt/opensips/mi_cancel.sh '$ci'", , $var(micancel));
			xlog("L_NOTICE", "OpenSIPS-AS: peer-leg cancel returned [$var(micancel)] for ci=$ci\n");
			# Match, never compare: exec() returns the status WITH a trailing newline.
			if (!($var(micancel) =~ "ok")) {
				xlog("L_ERR", "OpenSIPS-AS: could NOT cancel the peer b2b leg [$var(micancel)] ci=$ci -- THE CALLEE WILL KEEP RINGING; see the mi_cancel stderr above\n");
			}
		} else {
			xlog("L_ERR", "OpenSIPS-AS: CANCEL matched NO transaction ci=$ci from=$fU -- 481. If the callee is still ringing, the CANCEL died HERE\n");
			send_reply(481, "Transaction Does Not Exist");
		}
		exit;
	}

	# Roster SUBSCRIBE (RFC 4575): answer 489, not 200. A 200 obliges us to send NOTIFYs
	# we never send, which strands the subscription and blocks the next merge.
	# Never 405. Proper fix is to implement the package.
	if (is_method("SUBSCRIBE")) {
		send_reply(489, "Bad Event");
		exit;
	}

	if (!is_method("INVITE")) {
		send_reply(405, "Method Not Allowed");
		exit;
	}

	# Consume our own top Route hop; the remaining one is the S-CSCF ODI return, which
	# loose_route() leaves as the destination for the b2b outgoing leg.
	loose_route();

	# CONFERENCE FACTORY (merge). "Merge" dials sip:mmtel@conf-factory.<domain>; do NOT
	# relay it into the core, nothing terminates it. Anchor it against a FreeSWITCH room
	# keyed on A's from-tag, which is identical on A's later REFERs so the REFER handler
	# derives the same room with no shared state. conf_req intercepts those REFERs.
	if ($rd =~ "^conf-factory") {
		# Audio vs video follows the INITIATOR's SDP, kept in $b2b_logic.ctx(vid) so REFERs
		# pull participants into the matching room. The ROOM decides, not a codec filter:
		# the bridge INVITE is 3pcc/no-SDP, so FreeSWITCH offers from the room profile.
		$var(vid) = "0";
		if ($rb =~ "m=video [1-9]") {
			$var(vid) = "1";
		}

		# Join an existing room rather than opening a second one. Merge is not the
		# initiator's privilege: any participant can add a party, and its handset dials this
		# same factory. Keying blindly on $ft would build a SECOND room and trunk the two
		# mixers together -- that trunk has FreeSWITCH on both ends with no rtpengine
		# between them, so one end runs SRTP and both halves go deaf.
		# Every failure status means "not in a room", i.e. today's behaviour, so this
		# lookup cannot break an initiator-led merge. Blocks ~ms, 1 s ceiling (shorter than
		# elsewhere: no transaction exists yet to absorb INVITE retransmissions).
		exec("/mnt/opensips/mi_findroom.sh '$fU'", , $var(fr));
		# Defaults first: $var() is per-PROCESS and survives between messages.
		$var(join) = 0;
		$var(rtag) = $ft;
		$var(ftag) = "";
		if ($var(fr) =~ "^[av]:") {
			$var(ftag) = $(var(fr){re.subst,/^[av]://});
			# HARD GUARD -- never splice an unvalidated value into the RURI. A malformed RURI
			# does not degrade, it CRASHES: b2b_init_request builds an unparsable request and
			# segfaults the worker (one stray newline from exec() took the AS down once).
			# mi_findroom.sh validates too; this is the second gate.
			if ($var(ftag) =~ "^[0-9a-zA-Z]+$") {
				$var(join) = 1;
				$var(rtag) = $var(ftag);
			} else {
				xlog("L_ERR", "AS-CONF: mi_findroom returned a malformed room tag [$var(fr)] -- opening our own room instead; an unvalidated tag in the RURI segfaults b2b_init_request\n");
			}
		}

		if ($var(join) == 1) {
			# The ROOM's media type wins, not this INVITE's SDP. confj-/confjv- are isfocus like
			# conf-/confv- but WITHOUT endconf, so a joiner leaving cannot tear the room down.
			if ($var(fr) =~ "^v:") {
				$var(vid) = "1";
				$ru = "sip:confjv-" + $var(rtag) + "@${FREESWITCH_IP}:5090";
			} else {
				$var(vid) = "0";
				$ru = "sip:confj-" + $var(rtag) + "@${FREESWITCH_IP}:5090";
			}
			xlog("L_NOTICE", "AS-CONF: factory INVITE from=$fU ft=$ft ci=$ci JOINS existing room $var(rtag) video=$var(vid) -> $ru\n");
		} else {
			if ($var(vid) == "1") {
				$ru = "sip:confv-" + $ft + "@${FREESWITCH_IP}:5090";
			} else {
				$ru = "sip:conf-" + $ft + "@${FREESWITCH_IP}:5090";
			}
			xlog("L_NOTICE", "AS-CONF: factory INVITE from=$fU ft=$ft ci=$ci video=$var(vid) findroom=[$var(fr)] -> $ru\n");
		}
		# --------------------------------------------------------------------------

		$du = "sip:${FREESWITCH_IP}:5090;transport=udp";
		if (!b2b_init_request("top hiding", , "conf_req", "conf_reply")) {
			xlog("L_ERR", "AS-CONF: b2b_init_request FAILED for factory ci=$ci\n");
			send_reply(500, "Conference focus failed");
			exit;
		}
		$b2b_logic.ctx(vid) = $var(vid);
		# The REFER handler derives the room from $ft because the focus dialog's
		# from-tag is the same on every REFER. That holds only while the room IS this
		# dialog's tag, so a joiner must carry the room it actually joined.
		$b2b_logic.ctx(rtag) = $var(rtag);
		# "Has this joiner's old participant leg been retired yet?" Always initialised
		# so the REFER handler can test it positively -- an unset context variable is
		# exactly the kind of comparison that already cost one config parse failure.
		$b2b_logic.ctx(retired) = "0";
		exit;
	}
	# ============================================================================

	# b2b builds the outgoing client leg's To FROM THE RURI. A tel: RURI has no host,
	# so b2b emits "sip:user@" (hostless) -> S-CSCF 400 Invalid To. Rewrite a numeric
	# tel: RURI to a proper sip: AOR so b2b's generated To/RURI are valid. The S-CSCF
	# routes this terminating exactly as it would the tel: form (it normalises anyway).
	if ($rU =~ "^[0-9+*#]+$") {
		$ru = "sip:" + $rU + "@${IMS_DOMAIN}";
		xlog("L_NOTICE", "OpenSIPS-AS: normalised tel RURI -> $ru\n");
	}

	# Send the outgoing leg to the I-CSCF rather than short-circuiting to the S-CSCF via
	# the ODI, restoring the standard AS -> I-CSCF -> S-CSCF -> P-CSCF terminating path.
	$du = "sip:${ICSCF_IP}:4060";

	# Inter-NIB inbound arrives via the term iFC, keyed on X-Fallback-Origin. The leg we
	# regenerate does not carry that header (not in custom_headers), so it cannot re-trigger.
	$var(leg) = "orig";
	if (is_present_hf("X-Fallback-Origin")) {
		$var(leg) = "term/inter-NIB";
	}
	xlog("L_NOTICE", "OpenSIPS-AS: anchor INVITE leg=$var(leg) ci=$ci from=$fU ruri=$ru du=$du -> b2b top-hiding\n");

	# Anchor as B2BUA (topology hiding). Fresh Call-ID on the S-CSCF-facing leg.
	# Do NOT t_newtran()/t_relay() after this -- b2b owns the transaction + all
	# in-dialog traffic. (Verified for 3.6: scenario id string "top hiding".)
	if (!b2b_init_request("top hiding")) {
		xlog("L_ERR", "OpenSIPS-AS: b2b_init_request(top hiding) FAILED for $ci\n");
		send_reply(500, "B2B init failed");
	}
	exit;
}

# ---------------- STAGE 2: per-session routes for the conference focus ----------
# In-dialog requests on the A<->FreeSWITCH focus session land here instead of
# being auto-relayed. CRITICAL: A's REFERs must be terminated HERE -- FreeSWITCH
# does not understand IMS conference REFERs (it would attempt a blind transfer).
route[conf_req] {
	xlog("L_NOTICE", "AS-CONF: in-dialog $rm on focus key=$b2b_logic.key ci=$ci ft=$ft\n");

	if (is_method("REFER")) {
		# The handset merges attended-transfer style: Refer-To carries ?Replaces=<dialog>
		# naming ITS leg of the call to absorb. We 202 (Refer-Sub: false, no NOTIFY sub) and
		# re-anchor that call's FAR party into the room via MI b2b_bridge, which re-INVITEs
		# it with the room's SDP -- no new call, no ring -- then BYEs the absorbed leg.
		# Native b2b REFER handling is skipped for this tuple by build patch 2.
		xlog("L_NOTICE", "AS-CONF: REFER Refer-To=[$hdr(Refer-To)]\n");
		xlog("L_NOTICE", "AS-CONF: REFER Referred-By=[$hdr(Referred-By)] Refer-Sub=[$hdr(Refer-Sub)] Supported=[$hdr(Supported)]\n");

		# Which room do these REFERs act on? Normally the focus dialog's own from-tag, but a
		# focus that JOINED someone else's room carries that room's tag on the b2b context.
		# $var(join) must mean "joined someone else's room", not merely "tag known".
		# Defaults FIRST, then override: $var() is per-PROCESS and survives between
		# messages. (There is no $null in OpenSIPS -- that spelling is Kamailio's.)
		$var(join) = 0;
		$var(rtag) = $ft;
		$var(ctag) = "";
		$var(ctag) = $b2b_logic.ctx(rtag);
		if ($var(ctag) =~ "^[0-9a-zA-Z]+$") {
			$var(rtag) = $var(ctag);
			if ($var(rtag) != $ft) {
				$var(join) = 1;
			}
		}

		# --- extract the Replaces dialog id from the Refer-To URI headers ----
		$var(rt_hdrs) = $(hdr(Refer-To){nameaddr.uri}{uri.headers});

		# Per-participant Drop: the handset's Drop button sends a REFER with method=BYE and
		# NO Replaces, so it must be handled before the missing-Replaces 488 below.
		# There is no dialog id to bridge on, only a number, so mi_drop.sh finds the tuple
		# by room + number. Scoping by room matters: the number may be in another call.
		$var(rt_uri) = $(hdr(Refer-To){nameaddr.uri});
		if ($var(rt_uri) =~ "method=BYE") {
			# First run of digits: works for tel:9876548010;method=BYE and for
			# sip:9876548010@domain;method=BYE alike.
			$var(dropnum) = $(var(rt_uri){re.subst,/^[^0-9]*([0-9]+).*$/\1/});
			if ($b2b_logic.ctx(vid) == "1") {
				$var(droom) = "confpv-" + $var(rtag);
			} else {
				$var(droom) = "confp-" + $var(rtag);
			}
			xlog("L_NOTICE", "AS-CONF: DROP participant request number=$var(dropnum) room=$var(droom)\n");
			$var(akey) = $b2b_logic.entity(key);
			# Blocks (3rd arg), like the bridge, but we reply only AFTER the result is known: a
			# 202 for a drop that did not happen is a lie. 2 s worst case vs the handset's ~5 s.
			# "drop" widens the room match to any participant extension AND chains to everyone
			# the target introduced. The retire call below must NOT pass it -- see mi_drop.sh.
			exec("/mnt/opensips/mi_drop.sh '$var(dropnum)' '$var(droom)' 'drop'", , $var(midrop));
			xlog("L_NOTICE", "AS-CONF: drop returned [$var(midrop)] for $var(dropnum)\n");
			# Match, never compare: exec() returns the status WITH a trailing newline.
			if ($var(midrop) =~ "ok") {
				b2b_send_reply(202, "Accepted");
				# Same refer-event NOTIFY as the merge path -- this handset does not
				# support norefersub, so without it it drops its conference leg a few
				# seconds later. Arg order and the verbatim 5th arg matter; see the
				# merge NOTIFY below.
				ua_session_update("$var(akey)", "NOTIFY", "SIP/2.0 200 OK",
					"Event: refer;id=$cs\r\nSubscription-State: terminated;reason=noresource\r\n",
					"Content-Type: message/sipfrag\r\n");
			} else if ($var(midrop) =~ "notfound") {
				xlog("L_ERR", "AS-CONF: DROP FAILED, no participant $var(dropnum) in room $var(droom) -- the raw b2b_logic:list is in the mi_drop stderr above\n");
				b2b_send_reply(404, "Participant Not Found");
			} else {
				xlog("L_ERR", "AS-CONF: DROP FAILED [$var(midrop)] number=$var(dropnum) room=$var(droom)\n");
				b2b_send_reply(500, "Drop Failed");
			}
			exit;
		}
		# ---------------------------------------------------------------------------

		if (!($var(rt_hdrs) =~ "Replaces=")) {
			xlog("L_ERR", "AS-CONF: REFER without Replaces and not a method=BYE drop -- cannot act [$var(rt_hdrs)] uri=[$var(rt_uri)]\n");
			b2b_send_reply(488, "Not Acceptable Here");
			exit;
		}
		# strip everything up to Replaces=, cut other URI-headers, unescape
		$var(repl) = $(var(rt_hdrs){re.subst,/^.*Replaces=//i});
		$var(repl) = $(var(repl){re.subst,/&.*$//});
		$var(repl) = $(var(repl){re.subst,/%3B/;/gi});
		$var(repl) = $(var(repl){re.subst,/%3D/=/gi});
		# %40 -> @ is REQUIRED for the 4th party. A participant that CALLS the initiator is
		# absorbed on our own client leg, whose B2B.* Call-ID has no '@' to decode -- so
		# REFERs 1 and 2 always worked. When the initiator CALLS OUT the dialog carries the
		# HANDSET's Call-ID, which the phone escapes as %40; undecoded it matches no entity.
		$var(repl) = $(var(repl){re.subst,/%40/@/gi});
		# %3A -> : for Call-IDs carrying a host:port form. Harmless when absent.
		$var(repl) = $(var(repl){re.subst,/%3A/:/gi});
		# Any '%' left here means the handset escaped something we do not decode yet.
		# That is precisely the failure above, so make it LOUD instead of silent: the
		# bridge would otherwise fail with a "Could not find entity" that looks like a
		# state bug rather than an unescaping bug.
		if ($var(repl) =~ "%") {
			xlog("L_ERR", "AS-CONF: Replaces still percent-escaped after unescaping [$var(repl)] -- add the missing escape here or the bridge WILL fail to find the entity\n");
		}
		# now: <callid>;from-tag=X;to-tag=Y[;early-only]
		$var(rci) = $(var(repl){s.select,0,;});
		$var(rft) = $(var(repl){re.subst,/^.*from-tag=([^;]+).*$/\1/i});
		$var(rtt) = $(var(repl){re.subst,/^.*to-tag=([^;]+).*$/\1/i});
		# Room must match the media type, and the PORT matters as much as the extension: the
		# 3pcc leg is offered from FreeSWITCH's PROFILE, so audio must use the audio-only
		# merge-audio profile (5094) or the participant rings as video; video uses
		# merge-video (5096). Both ports exist only to hold enable-3pcc, which is NOT
		# harmless on 5090 -- there it put plain inbound video one participant behind.
		# 5090 still takes the FOCUS legs, which arrive WITH SDP and need no 3pcc.
		if ($b2b_logic.ctx(vid) == "1") {
			$var(proom) = "confpv-" + $var(rtag);
			$var(pport) = "5096";
		} else {
			$var(proom) = "confp-" + $var(rtag);
			$var(pport) = "5094";
		}
		xlog("L_NOTICE", "AS-CONF: re-anchor dialog [$var(rci);$var(rft);$var(rtt)] vid=$b2b_logic.ctx(vid) join=$var(join) -> room $var(proom) port $var(pport)\n");

		# Capture the REFER sender's (A's) b2b entity key NOW, while this request
		# context still points at it -- needed to send the refer NOTIFY back to A.
		$var(akey) = $b2b_logic.entity(key);

		b2b_send_reply(202, "Accepted");

		# A participant that pressed merge REFERs BOTH of its calls: the new party, and its
		# own existing leg into this room. Bridging the latter joins the room to ITSELF and
		# every phone echoes. Do not try to tell the two REFERs apart -- an early attempt
		# matched the Replaces Call-ID against b2b_logic:list, which carries no Call-IDs.
		# Instead retire the joiner's old tuple ONCE (number + room, what mi_drop.sh
		# already does) and let both REFERs bridge: the one naming the dead dialog fails,
		# which is correct. Order-independent, and only reachable when we joined someone
		# else's room, so an initiator-led merge keeps its single blocking exec.
		if ($var(join) == 1) {
			if ($b2b_logic.ctx(retired) == "0") {
				# Set BEFORE the call: on the 2 s worst case the second REFER must not start a
				# duplicate retire and terminate a leg this one already replaced.
				$b2b_logic.ctx(retired) = "1";
				exec("/mnt/opensips/mi_drop.sh '$fU' '$var(proom)'", , $var(miretire));
				xlog("L_NOTICE", "AS-CONF: retire joiner $fU old leg in $var(proom) returned [$var(miretire)]\n");
				# Match, never compare: exec() returns the status WITH a trailing newline.
				if (!($var(miretire) =~ "ok")) {
					xlog("L_ERR", "AS-CONF: could NOT retire $fU's old leg in $var(proom) [$var(miretire)] -- it stays a direct member while also holding a focus leg, so the room WILL echo; see the mi_drop stderr above\n");
				}
			}
		}
		# --------------------------------------------------------------------------

		# Fire the bridge via MI. BLOCKS, and MUST stay ordered before the refer-NOTIFY
		# below, or the handset's BYE destroys the tuple first. The 3rd arg is what makes
		# exec() block -- do NOT drop it.
		exec("/mnt/opensips/mi_bridge.sh '$var(rci);$var(rft);$var(rtt)' 'sip:$var(proom)@${FREESWITCH_IP}:$var(pport)'",
			, $var(mibridge));
		xlog("L_NOTICE", "AS-CONF: bridge returned [$var(mibridge)] for $var(proom)\n");
		# Surface a failed bridge at ERROR: mi_bridge.sh used to report "ok" for any MI reply
		# including a JSON-RPC error, so a party that never joined looked like a success.
		# MATCH, do not compare: exec() returns stdout INCLUDING echo's trailing
		# newline, so an equality test against "ok" fires on every SUCCESSFUL bridge.
		if (!($var(mibridge) =~ "ok")) {
			if ($var(join) == 1) {
				# EXPECTED for exactly one of a joiner's two REFERs: it names the leg
				# retired above, whose entity is gone, and that party is already in the
				# room. Only worry if BOTH of a joiner's REFERs land here.
				xlog("L_NOTICE", "AS-CONF: bridge found no entity for [$var(rci)] in $var(proom) -- expected for the REFER naming this joiner's own retired leg\n");
			} else {
				xlog("L_ERR", "AS-CONF: BRIDGE FAILED [$var(mibridge)] for $var(proom) dialog [$var(rci);$var(rft);$var(rtt)] -- this party will NOT join the conference; check the mi_bridge stderr line above for the MI error\n");
			}
		}

		# RFC 3515 refer-event NOTIFY back to A: the handset does not support norefersub, so
		# without this it drops its conference leg ~5 s after the REFER.
		# Arg order: key, method, body, EXTRA_HEADERS, CONTENT_TYPE. The 5th arg is copied
		# VERBATIM, so it must be a complete header line with CRLF, and must stay in that
		# arg or the module adds a second Content-Type.
		# 200 even when the bridge FAILED: on a failure sipfrag the Samsung handset aborts
		# the whole merge and BYEs every call in it (measured 2026-09-28, inter-NIB); with
		# 200 it sends its next REFER and the remaining parties still join.
		ua_session_update("$var(akey)", "NOTIFY", "SIP/2.0 200 OK",
			"Event: refer;id=$cs\r\nSubscription-State: terminated;reason=noresource\r\n",
			"Content-Type: message/sipfrag\r\n");
		exit;
	}

	# The roster SUBSCRIBE arrives IN-DIALOG, so the main-route 489 never sees it.
	# Answer here too, or it reaches FreeSWITCH and gets a 420 on sec-agree.
	if (is_method("SUBSCRIBE")) {
		b2b_send_reply(489, "Bad Event");
		exit;
	}

	# The focus leg is SIP-simple (FS answered immediately); pass everything else
	# (ACK, BYE, re-INVITE, UPDATE, PRACK) through to the peer.
	b2b_pass_request();
}

route[conf_reply] {
	xlog("L_NOTICE", "AS-CONF: focus reply $rs $rr (ci=$ci)\n");
	b2b_handle_reply();
}
