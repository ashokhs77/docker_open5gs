# RTPProxy control
######################################################################
# Optimus-only H.264 SDP normalization
######################################################################
# The handset vendor requested a=framerate:15 and an H.264 imageattr.  v11
# deliberately tests the higher 480x640 portrait size in offer and answer SDP.
#
# GATED TO THE EXACT OPTIMUS UA ONLY. The vendor's broad Android/Mobile
# expression would also match other working phones. NATMANAGE persists the
# Optimus identity for replies, whose own User-Agent may identify the remote
# endpoint or FreeSWITCH instead of the Optimus endpoint.
#
# Called from NATMANAGE before RTPengine offer/answer processing. v11 replaces imageattr for
# the offered Optimus H.264 payload types (normally PT 114/115), rather than
# retaining a lower resolution sent by the handset or the far end.
#
# TMMBR is removed only on this exact Optimus path. Captures from the tested
# handset show the peer/FreeSWITCH reducing the temporary maximum bitrate to
# 109568 and then 65536 bit/s even though the negotiated video bandwidth is
# AS:416/512. That runtime request overrides imageattr/framerate and is the
# reason the manufacturer SDP attributes alone did not improve the picture.
# NACK, PLI, SLI and FIR remain negotiated.
route[PATCH_OPTIMUS_VIDEO_SDP] {
	if (!has_body("application/sdp")) {
		xlog("L_INFO", "[OPTIMUS_VIDEO_SDP] skip=no-sdp ci=$ci\n");
		return;
	}
	if (!search_body("m=video")) {
		xlog("L_INFO", "[OPTIMUS_VIDEO_SDP] skip=no-video ci=$ci\n");
		return;
	}
	if (!search_body("H264/90000")) {
		xlog("L_WARN", "[OPTIMUS_VIDEO_SDP] skip=no-h264 ci=$ci\n");
		return;
	}

	# Inspect only the video media section. An attribute belonging to another
	# media section must not suppress the Optimus correction.
	$var(opt_in_video) = 0;
	$var(opt_h264_pt) = "";
	$var(opt_has_h264_115) = 0;
	$var(opt_has_framerate) = 0;
	$var(opt_has_imageattr) = 0;
	$var(opt_has_imageattr_115) = 0;
	$var(opt_imageattr_removed) = 0;
	$var(opt_has_tmmbr) = 0;
	$var(opt_tmmbr_removed) = 0;
	sdp_iterator_start("opt_video_scan");
	while (sdp_iterator_next("opt_video_scan")) {
		if ($sdpitval(opt_video_scan) =~ "^m=video[ \t]") {
			$var(opt_in_video) = 1;
		} else if ($sdpitval(opt_video_scan) =~ "^m=") {
			$var(opt_in_video) = 0;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(opt_video_scan) =~ "^a=rtpmap:[0-9]+[ \t]+H264/90000") {
			$var(opt_scan_pt) = $(sdpitval(opt_video_scan){s.select,0, }{s.select,1,:});
			if ($var(opt_h264_pt) == "") {
				$var(opt_h264_pt) = $var(opt_scan_pt);
			}
			if ($var(opt_scan_pt) == "115") {
				$var(opt_has_h264_115) = 1;
			}
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(opt_video_scan) =~ "^a=framerate:[0-9]+") {
			$var(opt_has_framerate) = 1;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(opt_video_scan) =~ "^a=rtcp-fb:([0-9]+|[*])[ \t]+ccm[ \t]+tmmbr") {
			$var(opt_has_tmmbr) = 1;
			sdp_iterator_rm("opt_video_scan");
			$var(opt_tmmbr_removed) = 1;
		}
	}
	sdp_iterator_end("opt_video_scan");

	if (!($var(opt_h264_pt) =~ "^[0-9]+$")) {
		xlog("L_WARN", "[OPTIMUS_VIDEO_SDP] skip=bad-h264-pt ci=$ci\n");
		return;
	}

	# Check imageattr in the video section and for this exact H.264 payload.
	$var(opt_in_video) = 0;
	sdp_iterator_start("opt_imageattr_scan");
	while (sdp_iterator_next("opt_imageattr_scan")) {
		if ($sdpitval(opt_imageattr_scan) =~ "^m=video[ \t]") {
			$var(opt_in_video) = 1;
		} else if ($sdpitval(opt_imageattr_scan) =~ "^m=") {
			$var(opt_in_video) = 0;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(opt_imageattr_scan) =~ "^a=imageattr:[0-9]+[ \t]") {
			$var(opt_imageattr_pt) = $(sdpitval(opt_imageattr_scan){s.select,0, }{s.select,1,:});
			if ($var(opt_imageattr_pt) == $var(opt_h264_pt)) {
				$var(opt_has_imageattr) = 1;
				sdp_iterator_rm("opt_imageattr_scan");
				$var(opt_imageattr_removed) = 1;
			}
			if ($var(opt_imageattr_pt) == "115"
					&& $var(opt_imageattr_pt) != $var(opt_h264_pt)) {
				$var(opt_has_imageattr_115) = 1;
				sdp_iterator_rm("opt_imageattr_scan");
				$var(opt_imageattr_removed) = 1;
			}
		}
	}
	sdp_iterator_end("opt_imageattr_scan");

	xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] candidate ci=$ci method=$rm status=$rs primary_pt=$var(opt_h264_pt) h264_115=$var(opt_has_h264_115) framerate=$var(opt_has_framerate) imageattr_primary=$var(opt_has_imageattr) imageattr_115=$var(opt_has_imageattr_115) imageattr_replaced=$var(opt_imageattr_removed) tmmbr=$var(opt_has_tmmbr)\n");

	# Insert the normalized 480x640 imageattr after the selected H.264 rtpmap.
	$var(opt_sdp_changed) = $var(opt_tmmbr_removed);
	if ($var(opt_imageattr_removed) == 1) {
		$var(opt_sdp_changed) = 1;
	}
	$var(opt_has_imageattr) = 0;
	$var(opt_has_imageattr_115) = 0;
	$var(opt_in_video) = 0;
	sdp_iterator_start("opt_video_patch");
	while (sdp_iterator_next("opt_video_patch")) {
		if ($sdpitval(opt_video_patch) =~ "^m=video[ \t]") {
			$var(opt_in_video) = 1;
		} else if ($sdpitval(opt_video_patch) =~ "^m=") {
			$var(opt_in_video) = 0;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(opt_video_patch) =~ "^a=rtpmap:[0-9]+[ \t]+H264/90000") {
			$var(opt_patch_pt) = $(sdpitval(opt_video_patch){s.select,0, }{s.select,1,:});
			if ($var(opt_patch_pt) == $var(opt_h264_pt)) {
				if ($var(opt_has_imageattr) == 0) {
					sdp_iterator_append("opt_video_patch",
						"a=imageattr:$var(opt_h264_pt) send [x=480,y=640] recv [x=480,y=640]\r\n");
					$var(opt_sdp_changed) = 1;
				}
				if ($var(opt_has_framerate) == 0) {
					sdp_iterator_append("opt_video_patch", "a=framerate:15\r\n");
					$var(opt_sdp_changed) = 1;
					$var(opt_has_framerate) = 1;
				}
			} else if ($var(opt_patch_pt) == "115"
					&& $var(opt_has_h264_115) == 1
					&& $var(opt_has_imageattr_115) == 0) {
				sdp_iterator_append("opt_video_patch",
					"a=imageattr:115 send [x=480,y=640] recv [x=480,y=640]\r\n");
				$var(opt_sdp_changed) = 1;
			}
		}
	}
	sdp_iterator_end("opt_video_patch");

	if ($var(opt_sdp_changed) == 1) {
		msg_apply_changes();
		xlog("L_INFO", "[OPTIMUS_VIDEO_SDP] applied ci=$ci primary_pt=$var(opt_h264_pt) h264_115=$var(opt_has_h264_115) size=480x640 fps=15 tmmbr_removed=$var(opt_tmmbr_removed)\n");
	} else {
		xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] unchanged=already-normalized ci=$ci primary_pt=$var(opt_h264_pt) h264_115=$var(opt_has_h264_115)\n");
	}
}

route[NATMANAGE] {
	if (is_request())
		xnotice("REQUEST: $rm $ru ($si:$sp, $ci)\n");
	else
		xnotice("REPLY: $rs $rr ($rm, $si:$sp, $ci)\n");

	if (is_direction("downstream"))
		xnotice("    downstream\n");
	else
		xnotice("    upstream\n");

	xnotice("    Offer: $avp(rtpproxy_offer_flags)\n");
	xnotice("    Answer: $avp(rtpproxy_answer_flags)\n");
	if (isflagset(FLT_MOBILE_ORIG)) {
		xnotice("    mo\n");
	} else {
		xnotice("    mt\n");
	}
	if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
		#if((is_request() && !check_route_param("rm=")) || (is_reply() && !isflagset(FLT_RTP))) {
		if(!check_route_param("rm=") && !isflagset(FLT_RTP)) {
			xnotice("No RM Param\n");
			return;
		}
		if (($fU != $null && is_in_profile("caller", "$fU")) ||
			($tU != $null && is_in_profile("callee", "$tU"))) {
			# In-Dialog Request from MO side
			if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			} else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
				if ($dlg_var(alias_added) == $null) {
					add_contact_alias();
					$dlg_var(alias_added) = "true";
				} else {
					xlog("L_INFO", "[ADD_CONTACT_ALIAS] Skipped duplicate alias (MO-side reply, already added)\n");
				}
			}
		} else if (($fU != $null && is_in_profile("callee", "$fU")) ||
			($tU != $null && is_in_profile("caller", "$tU"))) {
			# In-Dialog Request from MT side
			if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
				add_contact_alias();
			} else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
				if ($dlg_var(alias_added) == $null) {
					add_contact_alias();
					$dlg_var(alias_added) = "true";
				} else {
					xlog("L_INFO", "[ADD_CONTACT_ALIAS] Skipped duplicate alias (MT-side reply, already added)\n");
				}
			}
		}
	} else {
		if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
			xlog("L_DBG", "3) ADD_contact_alias();");
			add_contact_alias();
		}
	}

	if (isflagset(FLT_MOBILE_ORIG)) {
		$avp(setid) = 1;
		$avp(extra_id) = "mo";
	} else {
		$avp(setid) = 1;
#		$avp(setid) = 2;
		$avp(extra_id) = "mt";
	}

	if(!t_is_set("onreply_route")) t_on_reply("NAT_REPLY");
	if(!t_is_set("failure_route")) t_on_failure("NATMANAGE");

	if (is_method("BYE") || is_method("CANCEL") || t_is_failure_route()) {
		rtpengine_manage();
		/* On failure (e.g. 487 after early CANCEL), terminate the dialog
		   so ims_qos sends STR to PCRF and triggers E-RABReleaseCommand.
		   Without this, the dedicated bearer leaks when CANCEL arrives
		   before 180 Ringing (bearer established but not yet released). */
		if (t_is_failure_route()) {
			$avp(FTAG_CUSTOM_AVP) = $ft;
			$avp(TTAG_CUSTOM_AVP) = $tt;
			$avp(CALLID_CUSTOM_AVP) = $ci;
			if (dlg_get("$avp(CALLID_CUSTOM_AVP)", "$avp(FTAG_CUSTOM_AVP)", "$avp(TTAG_CUSTOM_AVP)")) {
				dlg_terminate("all", "Call failed - bearer cleanup");
			}
		}
		return;
	}

	setflag(FLT_RTP);

	if (!has_body("application/sdp")) {
		xnotice("No SDP body, skipping RTP handling\n");
		return;
	}

	# Scope by the exact Optimus UA. On replies, use the original transaction
	# request and the dialog marker: a response's own $ua belongs to the remote
	# endpoint/FreeSWITCH and cannot reliably identify the Optimus leg.
	$var(opt_scope) = "none";
	if (is_request() && $ua == "VoLTE/WFC UA") {
		$dlg_var(optimus_video_sdp) = "1";
		$var(opt_scope) = "request-ua";
	} else if (is_reply() && $T_req($ua) == "VoLTE/WFC UA") {
		$dlg_var(optimus_video_sdp) = "1";
		$var(opt_scope) = "transaction-request-ua";
	} else if ($dlg_var(optimus_video_sdp) == "1") {
		$var(opt_scope) = "dialog-marker";
	}

	if ($var(opt_scope) != "none") {
		xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] enter ci=$ci method=$rm status=$rs scope=$var(opt_scope) ua=[$ua]\n");
		route(PATCH_OPTIMUS_VIDEO_SDP);
	} else if (search_body("m=video") && search_body("H264/90000")) {
		xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] bypass=non-optimus ci=$ci method=$rm status=$rs ua=[$ua]\n");
	}

#!ifdef REMOVE_BITALIGNED_AMR
	route(REMOVE_BITALIGNED);
#!endif

#!ifndef FORCE_RTPRELAY
	if (!isflagset(FLT_NAT) || !check_route_param("rm="))
		return;
#!endif
	# Fix for calling between UEs not supporting preconditioning
	if(sdp_get_line_startswith("$avp(mline)", "a=inactive")) {
		xnotice("m-line: $avp(mline)\n");
		sdp_iterator_start("mlineit");
		while(sdp_iterator_next("mlineit")) {
			if($sdpitval(mlineit) =~ "a=inactive") {
				sdp_iterator_rm("mlineit");
				sdp_iterator_append("mlineit", "a=sendrecv\r\n");
				break;
			}
		}
		sdp_iterator_end("mlineit");
		msg_apply_changes();
	}

	# $sdp(c:ip) is ambiguous for a video-to-audio re-INVITE. Samsung and
	# Optimus keep the disabled video section as m=video 0/c=0.0.0.0, and the
	# pseudo-variable returns that last media-level address instead of the
	# still-active audio address. Select the first usable connection address
	# and deliberately ignore disabled media sections.
	$var(active_sdp_ip) = "";
	sdp_iterator_start("active_connection_scan");
	while (sdp_iterator_next("active_connection_scan")) {
		if ($sdpitval(active_connection_scan) =~ "^c=IN[ \t]+IP[46][ \t]+" &&
		    !($sdpitval(active_connection_scan) =~ "^c=IN[ \t]+IP[46][ \t]+0\.0\.0\.0")) {
			$var(active_sdp_ip) = $(sdpitval(active_connection_scan){s.select,2, }{s.trim});
			break;
		}
	}
	sdp_iterator_end("active_connection_scan");
	xlog("L_DBG", "[NAT_ACTIVE_SDP] selected=$var(active_sdp_ip) legacy=$sdp(c:ip) ci=$ci method=$rm status=$rs\n");

	# ---- Handle INVITE ----
	if (is_request() && is_method("INVITE,UPDATE") && has_body("application/sdp")) {

	    	if (has_totag()) {
			$dlg_var(alias_added) = $null;
			
        	# === Re-INVITE case (in-dialog) ===
        	if (isflagset(FLT_MOBILE_ORIG)) {
	   		if ($var(active_sdp_ip) != "" && $var(active_sdp_ip) != "DOCKER_HOST_IP") {
            			$dlg_var(reinvite_side) = "mo";
            			xlog("L_INFO", "[NAT] In-dialog $var(active_sdp_ip) reINVITE from MO -> RTPENGINE OFFER\n");
				if ($avp(rtpproxy_offer_flags) == $null){
					rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP");
	        			} else {
	            			rtpengine_offer($avp(rtpproxy_offer_flags));
				}
				if (ds_is_from_list("-1", "3", "sip:" + $var(active_sdp_ip)) &&
				    $var(active_sdp_ip) != "DOCKER_HOST_IP") {
					msg_apply_changes();
					xlog("L_INFO", "[INTER_NIB_REINVITE_RX_ANCHOR] Materialized MO local RTPengine offer before Rx authorization ci=$ci old_ip=$var(active_sdp_ip) new_ip=$sdp(c:ip)\n");
				}
			} else {
                		xlog("L_INFO", "[NAT] Skipping MO reINVITE, active/local IP: $var(active_sdp_ip)\n");
           		}
        	} else {
	   		if ($var(active_sdp_ip) != "" && $var(active_sdp_ip) != "DOCKER_HOST_IP") {
            			$dlg_var(reinvite_side) = "mt";
            			xlog("L_INFO", "[NAT] In-dialog $var(active_sdp_ip) reINVITE from MT -> RTPENGINE OFFER\n");
				if ($avp(rtpproxy_offer_flags) == $null){
	                                        rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP");
	                                } else {
	            			rtpengine_offer($avp(rtpproxy_offer_flags));
				}
				if (ds_is_from_list("-1", "3", "sip:" + $var(active_sdp_ip)) &&
				    $var(active_sdp_ip) != "DOCKER_HOST_IP") {
					msg_apply_changes();
					xlog("L_INFO", "[INTER_NIB_REINVITE_RX_ANCHOR] Materialized MT local RTPengine offer before Rx authorization ci=$ci old_ip=$var(active_sdp_ip) new_ip=$sdp(c:ip)\n");
				}
        		} else {
                		xlog("L_INFO", "[NAT] Skipping MT reINVITE, active/local IP: $var(active_sdp_ip)\n");
            		}
			}
    		} else {
        	# === Initial INVITE case ===
        	if (isflagset(FLT_MOBILE_ORIG)) {
            	if ($dlg_var(rtp_offer_done) == $null) {
                	set_dlg_profile("caller", "$fU");
                	$dlg_var(rtp_offer_done) = "true";
                	xlog("L_INFO", "[NAT] Initial MO INVITE offer -> RTPENGINE\n");
			if ($avp(rtpproxy_offer_flags) == $null){
	                                        rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP");
	                        } else {
#				xlog("L_INFO", "offer: $avp(rtpproxy_offer_flags)\n");
	                		rtpengine_offer($avp(rtpproxy_offer_flags));
			}
            	}
        	} else {
            	if ($dlg_var(rtp_offer_done) == $null) {
                	$dlg_var(rtp_offer_done) = "true";
                	xlog("L_INFO", "[NAT] Initial MT INVITE offer -> RTPENGINE\n");
			if ($avp(rtpproxy_offer_flags) == $null){
	                                        rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP");
	                        } else {
	                		rtpengine_offer($avp(rtpproxy_offer_flags));
			}
            	} else {
                	xlog("L_INFO", "[NAT] MT offer skipped (already done)\n");
                	$dlg_var(intra_call) = "true";
            	}
        	}
    	}
	}
	# ---- Handle 183/200 Answers ----
	else if (is_reply() && t_check_status("183|200") && has_body("application/sdp")) {

		# ANCHOR-BY-c:ip (fix for issue #4 callee-initiated A->V: the
		# re-INVITE RECEIVER's video bearer TFT got the PEER UE address
		# instead of rtpengine, so that UE sent no uplink video).
		#
		# The former logic chose which leg to skip by $dlg_var(reinvite_side).
		# For a callee-initiated intra-PLMN re-INVITE that skipped the leg
		# whose SDP still carried the raw far-end (peer UE) address - the
		# SAME leg on which Rx_AAR then ran and read that un-anchored
		# address, programming a peer-address bearer TFT (proven in the
		# pcscf log: MO_reply "skipping answer (self reINVITE)" then
		# w_rx_aar on that leg).
		#
		# Fix: decide by the SDP connection IP, exactly like the OFFER path
		# above (which uses `$sdp(c:ip) != "DOCKER_HOST_IP"` and is known
		# good).  Anchor the leg still carrying the far-end address
		# (c:ip != rtpengine) - this ALSO makes Rx_AAR on that leg read the
		# rtpengine-anchored address.  Skip the leg already rewritten to
		# rtpengine (c:ip == DOCKER_HOST_IP) so rtpengine is NOT re-run on
		# an already-anchored SDP (that reallocation was what broke media
		# in the earlier unconditional "anchor both legs" attempt).
		# DOCKER_HOST_IP is substituted to the P-CSCF/rtpengine media IP at
		# container init.
		#
		# active_sdp_ip ignores a disabled m=video 0/c=0.0.0.0 section,
		# so a video-to-audio change updates the active audio relay without
		# mistaking the disabled video address for the whole session.
		if (!isflagset(FLT_MOBILE_ORIG)) {
			set_dlg_profile("callee", "$tU");
		}
		if ($var(active_sdp_ip) != "" && $var(active_sdp_ip) != "DOCKER_HOST_IP") {
			# Answer from a NON-UE far-end (an AS such as FreeSWITCH,
			# IBCF, PSTN GW, ...) -> apply the rtpengine SDP
			# rewrite NOW, before Rx_AAR runs below. rtpengine_answer()
			# rewrites via lumps that only become visible once the message
			# is re-serialized; an intra-PLMN UE<->UE call has a second leg
			# that makes the rewrite visible before Rx_AAR reads it, but a
			# single-leg AS call (conference) does not - so without this,
			# ims_qos reads the raw AS address and
			# programs the UE's audio bearer TFT to point at the AS instead
			# of rtpengine.  The strict MTK UE then sends no uplink audio
			# (its RTP goes to rtpengine, which the AS-address bearer does
			# not match) -> one-way conference audio -> BYE.
			# Apply immediately only for a configured local AS or a peer listed
			# by dispatcher. UE pools and arbitrary endpoints stay on the normal
			# answer path, so no peer topology is duplicated in this route.
			if ($var(active_sdp_ip) == "FREESWITCH_IP" ||
			    $var(active_sdp_ip) == "IBCF_IP" ||
			    ds_is_from_list("-1", "3", "sip:" + $var(active_sdp_ip))) {
				xlog("L_INFO", "[NAT] $var(active_sdp_ip) core/AS-answer -> RTPENGINE anchor + apply\n");
				if ($avp(rtpproxy_answer_flags) == $null){
					rtpengine_answer("replace-origin replace-session-connection ICE=remove RTP/AVP");
				} else {
					rtpengine_answer($avp(rtpproxy_answer_flags));
				}
				msg_apply_changes();
			} else {
				xlog("L_INFO", "[NAT] $var(active_sdp_ip) 183/200 answer (far-end UE) -> RTPENGINE anchor\n");
				if ($avp(rtpproxy_answer_flags) == $null){
					rtpengine_answer("replace-origin replace-session-connection ICE=remove RTP/AVP");
				} else {
					rtpengine_answer($avp(rtpproxy_answer_flags));
				}
			}
		} else {
			xlog("L_INFO", "[NAT] answer already anchored (active c:ip=$var(active_sdp_ip)) - skip re-anchor\n");
		}
	}
}

# manage incoming replies
onreply_route[NAT_REPLY] {
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]")
		route(NATMANAGE);
	
	# NEW: clean up RTPEngine on failure responses
	if(status=~"[45][0-9][0-9]")
		rtpengine_manage();
}

route[REMOVE_BITALIGNED] {
	if (sdp_get_line_startswith("$avp(mline)", "m=")) {
		# xlog("m-line: $avp(mline)\n");
		sdp_get("$avp(sdp)");
		# xlog("\n$avp(sdp)\n");
		$var(x) = -1;
		$var(remove) = "";
		$var(codec) = $(avp(mline){s.select,$var(x), });
		# xlog("$$var(codec) => $var(codec)\n");
		while ($(var(codec){s.int}) > 0) {
			# xlog("$var(x)) $$var(codec) => $var(codec)\n");
			$var(s) = "a=fmtp:"+$var(codec);
			# xlog("$$var(s) => $var(s)\n");
			$var(fmtp) = $(avp(sdp){line.sw,$var(s)});
			# xlog("$$var(fmtp) => $var(fmtp)\n");
			if ($var(fmtp) =~ "a=fmtp:"+$var(codec)+" mode-change-capability.*") {
				# xlog("Match: $var(codec)\n");
				if ($var(remove) == "") {
					$var(remove) = $var(codec);
				} else {
					$var(remove) = $var(remove)+","+$var(codec);
				}
			}
			$var(codec) = $(avp(mline){s.select,$var(x), });
			$var(x) = $var(x) - 1;
		}
		if ($var(remove) != "") {
			sdp_remove_codecs_by_id($var(remove), "audio");
			msg_apply_changes();
		}
	}
}
