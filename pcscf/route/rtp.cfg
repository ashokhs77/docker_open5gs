# RTPProxy control
######################################################################
# Optimus-only H.264 SDP normalization
######################################################################
# The handset vendor requested a=framerate:15 and an H.264 imageattr.  v11
# deliberately tests the higher 480x640 portrait size in offer and answer SDP.
#
# GATED TO THE EXACT OPTIMUS UA ONLY. The vendor's broad Android/Mobile
# expression would also match other working phones. NATMANAGE persists the
# Optimus identity for replies, whose own User-Agent may identify the remote
# endpoint or FreeSWITCH instead of the Optimus endpoint.
#
# Called from NATMANAGE before RTPengine offer/answer processing. v11 replaces imageattr for
# the offered Optimus H.264 payload types (normally PT 114/115), rather than
# retaining a lower resolution sent by the handset or the far end.
#
# TMMBR is removed only on this exact Optimus path. Captures from the tested
# handset show the peer/FreeSWITCH reducing the temporary maximum bitrate to
# 109568 and then 65536 bit/s even though the negotiated video bandwidth is
# AS:416/512. That runtime request overrides imageattr/framerate and is the
# reason the manufacturer SDP attributes alone did not improve the picture.
# NACK, PLI, SLI and FIR remain negotiated.
route[PATCH_OPTIMUS_VIDEO_SDP] {
	if (!has_body("application/sdp")) {
		xlog("L_INFO", "[OPTIMUS_VIDEO_SDP] skip=no-sdp ci=$ci\n");
		return;
	}
	if (!search_body("m=video")) {
		xlog("L_INFO", "[OPTIMUS_VIDEO_SDP] skip=no-video ci=$ci\n");
		return;
	}
	if (!search_body("H264/90000")) {
		xlog("L_WARN", "[OPTIMUS_VIDEO_SDP] skip=no-h264 ci=$ci\n");
		return;
	}

	# Inspect only the video media section. An attribute belonging to another
	# media section must not suppress the Optimus correction.
	$var(opt_in_video) = 0;
	$var(opt_h264_pt) = "";
	$var(opt_has_h264_115) = 0;
	$var(opt_has_framerate) = 0;
	$var(opt_has_imageattr) = 0;
	$var(opt_has_imageattr_115) = 0;
	$var(opt_imageattr_removed) = 0;
	$var(opt_has_tmmbr) = 0;
	$var(opt_tmmbr_removed) = 0;
	# ONE iterator name for all three passes below. sdpops has only 4 slots per
	# worker and sdp_iterator_end() never frees a name, so every DISTINCT name
	# holds a slot for the life of the process. With 7 names, a worker that ran
	# this route first lost "dirit"/"pcit" for good: PRECOND_FS_ANSWER failed with
	# "no iterator available - max number is 4" and Motorola dropped conference
	# 1012 (2026-09-30). Keep this file to 4 names: optit, mlineit, dirit, pcit.
	sdp_iterator_start("optit");
	while (sdp_iterator_next("optit")) {
		if ($sdpitval(optit) =~ "^m=video[ \t]") {
			$var(opt_in_video) = 1;
		} else if ($sdpitval(optit) =~ "^m=") {
			$var(opt_in_video) = 0;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(optit) =~ "^a=rtpmap:[0-9]+[ \t]+H264/90000") {
			$var(opt_scan_pt) = $(sdpitval(optit){s.select,0, }{s.select,1,:});
			if ($var(opt_h264_pt) == "") {
				$var(opt_h264_pt) = $var(opt_scan_pt);
			}
			if ($var(opt_scan_pt) == "115") {
				$var(opt_has_h264_115) = 1;
			}
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(optit) =~ "^a=framerate:[0-9]+") {
			$var(opt_has_framerate) = 1;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(optit) =~ "^a=rtcp-fb:([0-9]+|[*])[ \t]+ccm[ \t]+tmmbr") {
			$var(opt_has_tmmbr) = 1;
			sdp_iterator_rm("optit");
			$var(opt_tmmbr_removed) = 1;
		}
	}
	sdp_iterator_end("optit");

	if (!($var(opt_h264_pt) =~ "^[0-9]+$")) {
		xlog("L_WARN", "[OPTIMUS_VIDEO_SDP] skip=bad-h264-pt ci=$ci\n");
		return;
	}

	# Check imageattr in the video section and for this exact H.264 payload.
	$var(opt_in_video) = 0;
	sdp_iterator_start("optit");
	while (sdp_iterator_next("optit")) {
		if ($sdpitval(optit) =~ "^m=video[ \t]") {
			$var(opt_in_video) = 1;
		} else if ($sdpitval(optit) =~ "^m=") {
			$var(opt_in_video) = 0;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(optit) =~ "^a=imageattr:[0-9]+[ \t]") {
			$var(opt_imageattr_pt) = $(sdpitval(optit){s.select,0, }{s.select,1,:});
			if ($var(opt_imageattr_pt) == $var(opt_h264_pt)) {
				$var(opt_has_imageattr) = 1;
				sdp_iterator_rm("optit");
				$var(opt_imageattr_removed) = 1;
			}
			if ($var(opt_imageattr_pt) == "115"
					&& $var(opt_imageattr_pt) != $var(opt_h264_pt)) {
				$var(opt_has_imageattr_115) = 1;
				sdp_iterator_rm("optit");
				$var(opt_imageattr_removed) = 1;
			}
		}
	}
	sdp_iterator_end("optit");

	xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] candidate ci=$ci method=$rm status=$rs primary_pt=$var(opt_h264_pt) h264_115=$var(opt_has_h264_115) framerate=$var(opt_has_framerate) imageattr_primary=$var(opt_has_imageattr) imageattr_115=$var(opt_has_imageattr_115) imageattr_replaced=$var(opt_imageattr_removed) tmmbr=$var(opt_has_tmmbr)\n");

	# Insert the normalized 480x640 imageattr after the selected H.264 rtpmap.
	$var(opt_sdp_changed) = $var(opt_tmmbr_removed);
	if ($var(opt_imageattr_removed) == 1) {
		$var(opt_sdp_changed) = 1;
	}
	$var(opt_has_imageattr) = 0;
	$var(opt_has_imageattr_115) = 0;
	$var(opt_in_video) = 0;
	sdp_iterator_start("optit");
	while (sdp_iterator_next("optit")) {
		if ($sdpitval(optit) =~ "^m=video[ \t]") {
			$var(opt_in_video) = 1;
		} else if ($sdpitval(optit) =~ "^m=") {
			$var(opt_in_video) = 0;
		} else if ($var(opt_in_video) == 1
				&& $sdpitval(optit) =~ "^a=rtpmap:[0-9]+[ \t]+H264/90000") {
			$var(opt_patch_pt) = $(sdpitval(optit){s.select,0, }{s.select,1,:});
			if ($var(opt_patch_pt) == $var(opt_h264_pt)) {
				if ($var(opt_has_imageattr) == 0) {
					sdp_iterator_append("optit",
						"a=imageattr:$var(opt_h264_pt) send [x=480,y=640] recv [x=480,y=640]\r\n");
					$var(opt_sdp_changed) = 1;
				}
				if ($var(opt_has_framerate) == 0) {
					sdp_iterator_append("optit", "a=framerate:15\r\n");
					$var(opt_sdp_changed) = 1;
					$var(opt_has_framerate) = 1;
				}
			} else if ($var(opt_patch_pt) == "115"
					&& $var(opt_has_h264_115) == 1
					&& $var(opt_has_imageattr_115) == 0) {
				sdp_iterator_append("optit",
					"a=imageattr:115 send [x=480,y=640] recv [x=480,y=640]\r\n");
				$var(opt_sdp_changed) = 1;
			}
		}
	}
	sdp_iterator_end("optit");

	if ($var(opt_sdp_changed) == 1) {
		msg_apply_changes();
		xlog("L_INFO", "[OPTIMUS_VIDEO_SDP] applied ci=$ci primary_pt=$var(opt_h264_pt) h264_115=$var(opt_has_h264_115) size=480x640 fps=15 tmmbr_removed=$var(opt_tmmbr_removed)\n");
	} else {
		xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] unchanged=already-normalized ci=$ci primary_pt=$var(opt_h264_pt) h264_115=$var(opt_has_h264_115)\n");
	}
}

route[NATMANAGE] {
	if (is_request())
		xnotice("REQUEST: $rm $ru ($si:$sp, $ci)\n");
	else
		xnotice("REPLY: $rs $rr ($rm, $si:$sp, $ci)\n");

	if (is_direction("downstream"))
		xnotice("    downstream\n");
	else
		xnotice("    upstream\n");

	xnotice("    Offer: $avp(rtpproxy_offer_flags)\n");
	xnotice("    Answer: $avp(rtpproxy_answer_flags)\n");
	if (isflagset(FLT_MOBILE_ORIG)) {
		xnotice("    mo\n");
	} else {
		xnotice("    mt\n");
	}
	if ((is_reply() && ($T_req($tt) != $null)) || (is_request() && has_totag())) {
		#if((is_request() && !check_route_param("rm=")) || (is_reply() && !isflagset(FLT_RTP))) {
		if(!check_route_param("rm=") && !isflagset(FLT_RTP)) {
			xnotice("No RM Param\n");
			return;
		}
		if (($fU != $null && is_in_profile("caller", "$fU")) ||
		    ($tU != $null && is_in_profile("callee", "$tU"))) {
		    # In-Dialog Request from MO side
    		    if (is_request() && isflagset(FLT_MOBILE_ORIG)) {
        	
        		add_contact_alias();
    		    } else if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
        	    if ($dlg_var(alias_added) == $null) {
            		
            		add_contact_alias();
            		$dlg_var(alias_added) = "true";
        	    } else {
            		xlog("L_INFO","[ADD_CONTACT_ALIAS] Skipped duplicate alias (MO-side reply, already added)\n");
        		}
   	 	    }	
		} else if (($fU != $null && is_in_profile("callee", "$fU")) ||
    			($tU != $null && is_in_profile("caller", "$tU"))) {
    			# In-Dialog Request from MT side
    			if (is_request() && !isflagset(FLT_MOBILE_ORIG)) {
        		
        			add_contact_alias();
   	 		} else if (is_reply() && isflagset(FLT_MOBILE_ORIG)) {
        		if ($dlg_var(alias_added) == $null) {
            			
            			add_contact_alias();
            			$dlg_var(alias_added) = "true";
        		} else {
            			xlog("L_INFO","[ADD_CONTACT_ALIAS] Skipped duplicate alias (MT-side reply, already added)\n");
        		}
    		}
	}

	} else {
		if (is_reply() && !isflagset(FLT_MOBILE_ORIG)) {
			xlog("L_DBG", "3) ADD_contact_alias();");
			add_contact_alias();
		}
	}

	if (isflagset(FLT_MOBILE_ORIG)) {
		$avp(setid) = 1;
		$avp(extra_id) = "mo";
	} else {
		$avp(setid) = 1;
#		$avp(setid) = 2;
		$avp(extra_id) = "mt";
	}

	if(!t_is_set("onreply_route")) t_on_reply("NAT_REPLY");
	if(!t_is_set("failure_route")) t_on_failure("NATMANAGE");

	if (is_method("BYE") || is_method("CANCEL") || t_is_failure_route()) {
		rtpengine_manage();
		/* On failure (e.g. 487 after early CANCEL), terminate the dialog
		   so ims_qos sends STR to PCRF and triggers E-RABReleaseCommand.
		   Without this, the dedicated bearer leaks when CANCEL arrives
		   before 180 Ringing (bearer established but not yet released). */
		if (t_is_failure_route()) {
			$avp(FTAG_CUSTOM_AVP) = $ft;
			$avp(TTAG_CUSTOM_AVP) = $tt;
			$avp(CALLID_CUSTOM_AVP) = $ci;
			if (dlg_get("$avp(CALLID_CUSTOM_AVP)", "$avp(FTAG_CUSTOM_AVP)", "$avp(TTAG_CUSTOM_AVP)")) {
				dlg_terminate("all", "Call failed - bearer cleanup");
			}
		}
		return;
	}

	setflag(FLT_RTP);

	if (!has_body("application/sdp")) {
		xnotice("No SDP body, skipping RTP handling\n");
		return;
	}

	# Scope by the exact Optimus UA. On replies, use the original transaction
	# request and the dialog marker: a response's own $ua belongs to the remote
	# endpoint/FreeSWITCH and cannot reliably identify the Optimus leg.
	$var(opt_scope) = "none";
	if (is_request() && $ua == "VoLTE/WFC UA") {
		$dlg_var(optimus_video_sdp) = "1";
		$var(opt_scope) = "request-ua";
	} else if (is_reply() && $T_req($ua) == "VoLTE/WFC UA") {
		$dlg_var(optimus_video_sdp) = "1";
		$var(opt_scope) = "transaction-request-ua";
	} else if ($dlg_var(optimus_video_sdp) == "1") {
		$var(opt_scope) = "dialog-marker";
	}

	if ($var(opt_scope) != "none") {
		xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] enter ci=$ci method=$rm status=$rs scope=$var(opt_scope) ua=[$ua]\n");
		route(PATCH_OPTIMUS_VIDEO_SDP);
	} else if (search_body("m=video") && search_body("H264/90000")) {
		xlog("L_DBG", "[OPTIMUS_VIDEO_SDP] bypass=non-optimus ci=$ci method=$rm status=$rs ua=[$ua]\n");
	}

#!ifdef REMOVE_BITALIGNED_AMR
	route(REMOVE_BITALIGNED);
#!endif

#!ifndef FORCE_RTPRELAY
	if (!isflagset(FLT_NAT) || !check_route_param("rm="))
		return;
#!endif
	# Fix for calling between UEs not supporting preconditioning
	if(sdp_get_line_startswith("$avp(mline)", "a=inactive")) {
		xnotice("m-line: $avp(mline)\n");
		sdp_iterator_start("mlineit");
		while(sdp_iterator_next("mlineit")) {
			if($sdpitval(mlineit) =~ "a=inactive") {
				sdp_iterator_rm("mlineit");
				sdp_iterator_append("mlineit", "a=sendrecv\r\n");
				break;
			}
		}
		sdp_iterator_end("mlineit");
		msg_apply_changes();
	}

	# Before rtpengine_answer(): it needs the AMR fmtp to match the handset's offer.
	if (is_reply() && has_body("application/sdp")
			&& $sdp(c:ip) == $sel(cfg_get.freeswitch.bindip)) {
		route(FS_KEEP_AMR_FMTP);
	}

	# Make the merge re-anchor's RESUME explicit. FreeSWITCH's 3pcc offer carries NO
	# direction attribute at all; RFC 3264 says absent == sendrecv, so media is correct
	# either way (verified: all parties get 50 pps), but the handset was just put on
	# hold by its own a=sendonly ~1 s earlier and only renders "Call retrieved" on an
	# explicit a=sendrecv. Without this the party is resumed silently and its UI still
	# reads as held. Gated on FreeSWITCH's address so only the re-anchor leg is touched,
	# and placed here so it runs BEFORE rtpengine_offer() and reuses this block's
	# rebuild rather than adding a second one.
	if (is_method("INVITE") && has_totag()
			&& $sdp(c:ip) == $sel(cfg_get.freeswitch.bindip)
			&& !sdp_get_line_startswith("$avp(dirl)", "a=sendrecv")
			&& !sdp_get_line_startswith("$avp(dirl)", "a=sendonly")
			&& !sdp_get_line_startswith("$avp(dirl)", "a=recvonly")
			&& !sdp_get_line_startswith("$avp(dirl)", "a=inactive")) {
		# EVERY m= section, not just the first: FreeSWITCH's 3pcc offer is dual-m-line
		# (RTP/SAVP then RTP/AVP) and the handset uses the SECOND one, so tagging only
		# the first would leave the section it actually reads with no direction.
		$var(dir_added) = 0;
		sdp_iterator_start("dirit");
		while(sdp_iterator_next("dirit")) {
			if($sdpitval(dirit) =~ "^m=") {
				sdp_iterator_append("dirit", "a=sendrecv\r\n");
				$var(dir_added) = $var(dir_added) + 1;
			}
		}
		sdp_iterator_end("dirit");
		if ($var(dir_added) > 0) {
			msg_apply_changes();
			xlog("L_INFO", "[NAT] re-anchor INVITE had no direction attribute, added explicit a=sendrecv to $var(dir_added) m-section(s) so the party sees the call retrieved\n");
		}
	}
	
	# ---- Handle INVITE ----
	if (is_request() && is_method("INVITE,UPDATE") && has_body("application/sdp")) {

    		if (has_totag()) {
		 $dlg_var(alias_added) = $null;
        	# === Re-INVITE case (in-dialog) ===
        	if (isflagset(FLT_MOBILE_ORIG)) {
	   		if ($sdp(c:ip) != "DOCKER_HOST_IP") {
            			$dlg_var(reinvite_side) = "mo";
            			xlog("L_INFO", "[NAT] In-dialog $sdp(c:ip) reINVITE from MO -> RTPENGINE OFFER\n");
				if ($avp(rtpproxy_offer_flags) == $null){
					rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP generate-RTCP");
        			} else {
            				rtpengine_offer($avp(rtpproxy_offer_flags));
				}
			} else {
                	# c=DOCKER_HOST_IP is the PEER leg's rtpengine rewrite, NOT "media unchanged":
                	# each leg has its own session, so the peer's port must still be re-mapped or
                	# a hold leaks it to the UE and the call BYEs on RTCP timeout.
                	# noauth_cseq: the offer updates the session, ports (and TFTs) do not change.
                	# Do NOT set $dlg_var(reinvite_side) here -- this re-INVITE is inbound toward
                	# the UE, and setting it fires the MT answer branch on intra-network calls.
                	xlog("L_INFO", "[NAT] In-dialog MO reINVITE, peer-leg SDP $sdp(c:ip) -> RTPENGINE OFFER (re-map into this leg)\n");
                	if ($avp(rtpproxy_offer_flags) == $null){
                		rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP generate-RTCP");
                	} else {
                		rtpengine_offer($avp(rtpproxy_offer_flags));
                	}
                	$dlg_var(noauth_cseq) = $cs;
           		}
        	} else {
	   		if ($sdp(c:ip) != "DOCKER_HOST_IP") {
				# Updates this leg's existing session rather than allocating a second one,
				# which keeps hold/resume and the merge re-anchor on stable ports.
            			$dlg_var(reinvite_side) = "mt";
            			xlog("L_INFO", "[NAT] In-dialog $sdp(c:ip) reINVITE from MT -> RTPENGINE OFFER\n");
				if ($avp(rtpproxy_offer_flags) == $null){
                                        rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP generate-RTCP");
                                } else {
            				rtpengine_offer($avp(rtpproxy_offer_flags));
				}
        		} else {
                		# Mirror of the MO branch above: which leg the held party sits on depends
                		# only on who originated, so skipping this half would fix B-holds-C and
                		# still break C-holds-B. Revert this half first if video hold regresses.
                		xlog("L_INFO", "[NAT] In-dialog MT reINVITE, peer-leg SDP $sdp(c:ip) -> RTPENGINE OFFER (re-map into this leg)\n");
                		if ($avp(rtpproxy_offer_flags) == $null){
                			rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP generate-RTCP");
                		} else {
                			rtpengine_offer($avp(rtpproxy_offer_flags));
                		}
                		$dlg_var(noauth_cseq) = $cs;
            		}
			}
    		} else {
        	# === Initial INVITE case ===
        	if (isflagset(FLT_MOBILE_ORIG)) {
            	if ($dlg_var(rtp_offer_done) == $null) {
                	set_dlg_profile("caller", "$fU");
                	$dlg_var(rtp_offer_done) = "true";
                	# Remember whether this UE asked for RFC 3312 preconditions; only route(PRECOND_FS_ANSWER) reads it.
                	if (sdp_get_line_startswith("$avp(desqos)", "a=des:qos")) {
                		$dlg_var(precond) = "1";
                		xlog("L_INFO", "[NAT] MO offer requests QoS preconditions: $avp(desqos)\n");
                	}
                	xlog("L_INFO", "[NAT] Initial MO INVITE offer -> RTPENGINE\n");
			if ($avp(rtpproxy_offer_flags) == $null){
                                        rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP generate-RTCP");
                        } else {
#				xlog("L_INFO", "offer: $avp(rtpproxy_offer_flags)\n");
                		rtpengine_offer($avp(rtpproxy_offer_flags));
			}
            	}
        	} else {
            	if ($dlg_var(rtp_offer_done) == $null) {
                	$dlg_var(rtp_offer_done) = "true";
                	# Read the leg BEFORE offering -- rtpengine's rewrite is an unapplied lump.
			if ($sdp(c:ip) == "DOCKER_HOST_IP") {
				$var(b2b_term_leg) = 1;
			} else {
				$var(b2b_term_leg) = 0;
			}
			# EVERY leg gets its own session, B2B terminating one included. A skip here
			# broke repeat merges: a later offer found no session and allocated a fresh
			# one, splitting the two ends.
			xlog("L_INFO", "[NAT] Initial MT INVITE offer -> RTPENGINE (b2b_term_leg=$var(b2b_term_leg))\n");
			if ($var(b2b_term_leg) == 1) {
				# Single transcode across the chain: the peer leg already transcoded this SDP.
				# Adding codec-transcode-* here broke merge attempt 2 and video hold.
				rtpengine_offer("replace-origin replace-session-connection ICE=remove RTP/AVP generate-RTCP");
			} else if ($avp(rtpproxy_offer_flags) == $null){
				rtpengine_offer("replace-origin replace-session-connection codec-transcode-AMR codec-transcode-AMR-WB codec-transcode-PCMU codec-transcode-PCMA codec-transcode-OPUS ICE=remove RTP/AVP generate-RTCP");
			} else {
				rtpengine_offer($avp(rtpproxy_offer_flags));
			}
			# The flush below fixes a Motorola-as-callee 480 but breaks Samsung merge
			# and video hold, and no ordering satisfies both -- so gate it on the callee.
			# Contact form is a heuristic (Samsung = MSISDN digits, Motorola = UUID);
			# the xlog names the branch so a mis-detection is one grep away.
			$var(needs_aar_flush) = 0;
			if ($var(b2b_term_leg) == 1) {
				if ($rU =~ "^[0-9]+$") {
					xlog("L_INFO", "[NAT] B2B term leg: callee contact is MSISDN-style ($rU), NOT flushing -- keeps merge/hold working\n");
				} else {
					$var(needs_aar_flush) = 1;
				}
			}
			if ($var(needs_aar_flush) == 1) {
				# Without this the term AAR uses the pre-rewrite m= port, which on a B2B
				# leg belongs to the OTHER leg -- TFT matches no media, strict callee 480s.
				# MUST run here, before set_dlg_profile("term") in mt.cfg. Do NOT extend
				# it to mt.cfg's reply path.
				msg_apply_changes();
				xlog("L_INFO", "[NAT] B2B term leg: flushed SDP for Rx AAR (callee $rU)\n");
				if (sdp_get_line_startswith("$avp(flushed_mline)", "m=audio")) {
					xlog("L_INFO", "[NAT] B2B term leg: post-flush offer c=$sdp(c:ip) $avp(flushed_mline)\n");
				}
			}
            	} else {
                	xlog("L_INFO", "[NAT] MT offer skipped (already done)\n");
                	$dlg_var(intra_call) = "true";
            	}
        	}
    	}
	}
	# ---- Handle 183/200 Answers ----
	else if (is_reply() && t_check_status("183|200") && has_body("application/sdp")) {

		# DO NOT skip retransmitted answers here: that also skips rtpengine_answer(),
		# so the UE gets the far end's un-rewritten address and the call dies.
		# Duplicate suppression belongs in RX_MEDIA_DEDUP. The key is log labelling only.
		$var(ans_key) = "$cs|$rs|$sdp(c:ip)";
		if ($dlg_var(last_ans_key) == $var(ans_key)) {
			$var(ans_tag) = "REPEAT";
		} else {
			$var(ans_tag) = "first";
		}

    	if (isflagset(FLT_MOBILE_ORIG)) {
        	# Only answer if this is a reply to an MT reINVITE or initial answer
        	if ($dlg_var(reinvite_side) == "mt" || $dlg_var(intra_call) == $null) {
            	xlog("L_INFO", "[NAT] MO side 183/200 answer [$var(ans_tag)] CSeq=$cs $rs c=$sdp(c:ip) -> RTPENGINE\n");
		$dlg_var(last_ans_key) = $var(ans_key);
		if ($avp(rtpproxy_answer_flags) == $null){
                         rtpengine_answer("replace-origin replace-session-connection ICE=remove RTP/AVP");
                } else {
#			xlog("L_INFO", "answer: $avp(rtpproxy_answer_flags)\n");
            		rtpengine_answer($avp(rtpproxy_answer_flags));
		}
        	} else {
            		xlog("L_INFO", "[NAT] skipping answer (self reINVITE)\n");
        	}
    	} else {
        	# MT side
        	if ($dlg_var(reinvite_side) == "mo" || $dlg_var(intra_call) == $null) {
		set_dlg_profile("callee", "$tU");
            	xlog("L_INFO", "[NAT] MT side 183/200 answer [$var(ans_tag)] CSeq=$cs $rs c=$sdp(c:ip) -> RTPENGINE\n");
		$dlg_var(last_ans_key) = $var(ans_key);
		if ($avp(rtpproxy_answer_flags) == $null){
                         rtpengine_answer("replace-origin replace-session-connection ICE=remove RTP/AVP");
                } else {
            		rtpengine_answer($avp(rtpproxy_answer_flags));
		}
        	} else {
            		xlog("L_INFO", "[NAT] MT skipping answer (self reINVITE)\n");
        	}
    	}
	}
}

# manage incoming replies
onreply_route[NAT_REPLY] {
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]")
		route(NATMANAGE);
	
	# NEW: clean up RTPEngine on failure responses
	if(status=~"[45][0-9][0-9]")
		rtpengine_manage();
}

route[REMOVE_BITALIGNED] {
	if (sdp_get_line_startswith("$avp(mline)", "m=")) {
		# xlog("m-line: $avp(mline)\n");
		sdp_get("$avp(sdp)");
		# xlog("\n$avp(sdp)\n");
		$var(x) = -1;
		$var(remove) = "";
		$var(codec) = $(avp(mline){s.select,$var(x), });
		# xlog("$$var(codec) => $var(codec)\n");
		while ($(var(codec){s.int}) > 0) {
			# xlog("$var(x)) $$var(codec) => $var(codec)\n");
			$var(s) = "a=fmtp:"+$var(codec);
			# xlog("$$var(s) => $var(s)\n");
			$var(fmtp) = $(avp(sdp){line.sw,$var(s)});
			# xlog("$$var(fmtp) => $var(fmtp)\n");
			if ($var(fmtp) =~ "a=fmtp:"+$var(codec)+" mode-change-capability.*") {
				# xlog("Match: $var(codec)\n");
				if ($var(remove) == "") {
					$var(remove) = $var(codec);
				} else {
					$var(remove) = $var(remove)+","+$var(codec);
				}
			}
			$var(codec) = $(avp(mline){s.select,$var(x), });
			$var(x) = $var(x) - 1;
		}
		if ($var(remove) != "") {
			sdp_remove_codecs_by_id($var(remove), "audio");
			msg_apply_changes();
		}
	}
}

# WHY: Rx_AAR must authorize rtpengine's REWRITTEN port, but NATMANAGE leaves that
# rewrite unapplied, so without a flush a Motorola callee BYEs "Media bearer loss".
# USE: call from the MO answer path before Rx_AAR. Skips the conference focus leg.
route[FLUSH_MO_ANSWER] {
	# Snapshot c= before the flush: PRECOND_FS_ANSWER still has to gate on the
	# FreeSWITCH address, which msg_apply_changes() is about to overwrite.
	$var(pre_flush_cip) = $sdp(c:ip);
	if ($sdp(c:ip) == $sel(cfg_get.freeswitch.bindip)) {
		# ...unless the UE enforces its TFT: authorizing FreeSWITCH's internal address
		# leaves its uplink matching no filter. $dlg_var(precond) is the discriminator --
		# a UE that negotiates RFC 3312 is one that enforces its TFT.
		if ($dlg_var(precond) == "1") {
			xlog("L_INFO", "[NAT] MO answer flush ON conference leg: UE enforces QoS, TFT must name rtpengine not $sdp(c:ip)\n");
			# Do NOT call route(PRECOND_FS_ANSWER) here: two rebuilds of one reply body do
			# not compose. It stays in the MO answer branch.
			msg_apply_changes();
			return;
		}
		xlog("L_INFO", "[NAT] MO answer flush skipped, conference leg: $sdp(c:ip)\n");
		return;
	}
	xlog("L_INFO", "[NAT] MO answer flush for Rx: $sdp(c:ip)\n");
	msg_apply_changes();
}

# WHY: open5gs only ADDS packet filters to a PCC rule and refuses past 15 per bearer,
# so a call gets ~3 authorizations before 5142 / "Sorry no QoS available".
# USE: call immediately before Rx_AAR, after FLUSH_MO_ANSWER. No hold exception.
route[RX_MEDIA_DEDUP] {
	$var(aar_dup) = 0;
	# Clear first: sdp_get_line_startswith leaves the AVP untouched when the line is
	# absent, and AVPs survive across routes within one message.
	$avp(aar_ma) = $null;
	$avp(aar_mv) = $null;
	sdp_get_line_startswith("$avp(aar_ma)", "m=audio");
	sdp_get_line_startswith("$avp(aar_mv)", "m=video");
	# Separate PV comparisons -- Kamailio does not interpolate PVs inside a composite
	# key string, so every comparison would match and suppress every answer but the first.
	if ($dlg_var(aar_ip) == $sdp(c:ip)
			&& $dlg_var(aar_ma) == $avp(aar_ma)
			&& $dlg_var(aar_mv) == $avp(aar_mv)) {
		$var(aar_dup) = 1;
		return;
	}
	$dlg_var(aar_ip) = $sdp(c:ip);
	$dlg_var(aar_ma) = $avp(aar_ma);
	$dlg_var(aar_mv) = $avp(aar_mv);
}
# ---------------------------------------------------------------------------
# WHY: FreeSWITCH answers an in-dialog re-INVITE from its EXISTING codec and writes the
# AMR/AMR-WB rtpmap with NO fmtp, although its first answer carried one
# ("mode-set=8;octet-align=0;..."). rtpengine then finds nothing matching the handset's
# mode-set=8 re-offer and answers the handset with telephone-event only; Motorola BYEs
# 10 ms after its ACK (1012 dial-in, fs_1012.pcap 2026-09-30). Samsung never re-INVITEs.
# FIX: remember FreeSWITCH's own fmtp from the answer that has it, and put it back when a
# later answer on the same dialog drops it for the same payload type.
# USE: FreeSWITCH replies with SDP only, before rtpengine_answer(). Reuses the "pcit"
# iterator name: sdpops has 4 name slots per worker (see the note in
# PATCH_OPTIMUS_VIDEO_SDP), and this never runs while PRECOND_FS_ANSWER holds it.
route[FS_KEEP_AMR_FMTP] {
	# The first rtpmap is the audio codec FreeSWITCH chose.
	$avp(fs_rtpmap) = $null;
	if (!sdp_get_line_startswith("$avp(fs_rtpmap)", "a=rtpmap:"))
		return;
	if (!($avp(fs_rtpmap) =~ "^a=rtpmap:[0-9]+ AMR"))
		return;
	$var(fs_pt) = $(avp(fs_rtpmap){s.select,0, }{s.select,1,:});
	$avp(fs_fmtp) = $null;
	if (sdp_get_line_startswith("$avp(fs_fmtp)", "a=fmtp:$var(fs_pt) ")) {
		$dlg_var(fs_amr_fmtp) = $(avp(fs_fmtp){s.trim});
		return;
	}
	if ($dlg_var(fs_amr_fmtp) == $null
			|| !($dlg_var(fs_amr_fmtp) =~ "^a=fmtp:" + $var(fs_pt) + " "))
		return;
	$var(fs_fmtp_added) = 0;
	sdp_iterator_start("pcit");
	while (sdp_iterator_next("pcit")) {
		# $sdpitval keeps its line ending, so match the prefix, never compare whole lines.
		if ($sdpitval(pcit) =~ "^a=rtpmap:" + $var(fs_pt) + " ") {
			sdp_iterator_append("pcit", "$dlg_var(fs_amr_fmtp)\r\n");
			$var(fs_fmtp_added) = 1;
			break;
		}
	}
	sdp_iterator_end("pcit");
	if ($var(fs_fmtp_added) == 1) {
		msg_apply_changes();
		xlog("L_INFO", "[NAT] FS answer dropped the AMR fmtp for PT $var(fs_pt) ($rs, CSeq $cs), restored: $dlg_var(fs_amr_fmtp)\n");
	}
}

# ---------------------------------------------------------------------------
# WHY: FreeSWITCH does not implement RFC 3312, so a handset that offered mandatory
# preconditions never starts media and BYEs "Media bearer loss". Safe to mark met:
# the Rx AAR has already succeeded. Roles invert in the answer, so remote = handset.
# USE: call from the MO answer path AFTER FLUSH_MO_ANSWER (rtpengine_answer would
# discard the attributes). Only fires when $dlg_var(precond) is set.
route[PRECOND_FS_ANSWER] {
	if ($dlg_var(precond) != "1")
		return;
	# Gate on the pre-flush address: FLUSH_MO_ANSWER already rewrote c= to rtpengine,
	# so $sdp(c:ip) here would never match FreeSWITCH.
	if ($var(pre_flush_cip) != $sel(cfg_get.freeswitch.bindip))
		return;
	if (sdp_get_line_startswith("$avp(curqos)", "a=curr:qos")) {
		xlog("L_INFO", "[NAT] FS answer already carries preconditions, leaving it alone: $avp(curqos)\n");
		return;
	}
	# Append after m=audio: attribute order is not significant and m= is always present.
	$var(added) = 0;
	sdp_iterator_start("pcit");
	while(sdp_iterator_next("pcit")) {
		if($sdpitval(pcit) =~ "^m=audio" && $var(added) == 0) {
			sdp_iterator_append("pcit", "a=curr:qos local sendrecv\r\n");
			sdp_iterator_append("pcit", "a=curr:qos remote sendrecv\r\n");
			sdp_iterator_append("pcit", "a=des:qos mandatory remote sendrecv\r\n");
			sdp_iterator_append("pcit", "a=des:qos optional local sendrecv\r\n");
			$var(added) = 1;
			break;
		}
	}
	sdp_iterator_end("pcit");
	if ($var(added) == 1) {
		# No msg_apply_changes() here: a second rebuild leaves Rx_AAR with an empty TFT.
		# tm applies reply lumps on forwarding, so the handset still gets the attributes.
		xlog("L_INFO", "[NAT] FS answer: preconditions marked MET for handset that required them (c=$sdp(c:ip))\n");
	} else {
		xlog("L_WARN", "[NAT] FS answer: no m=audio found, preconditions NOT added -- handset will drop the leg\n");
	}
}
