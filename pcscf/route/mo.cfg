######################################################################
# Originating, Intial Requests
######################################################################
route[MO]
{
	# Strip Transport from RURI:
	$ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

	# Process route headers, if any:
	loose_route();
#!ifdef WITH_SIPP_TEST
	# SIPp/Python UE test bypass: skip registration check for synthetic test container IP.
	if (is_in_subnet("$si", "TEST_NETWORK")) {
		xlog("L_INFO", "[SIPP_TEST] Bypassing registration check for test IP $si\n");
	} else {
#!endif
	if (!pcscf_is_registered("pcscf_location")) {
		send_reply("403","Forbidden - You must register first with a S-CSCF");
		exit;
	}
#!ifdef WITH_SIPP_TEST
	}
#!endif

	# We do not trust the user, let's remove the P-Asserted-Identity, if any:
	remove_hf("P-Asserted-Identity");
	remove_hf("P-Preferred-Identity");

	# Add P-Charging-Vector
	sip_p_charging_vector("g");

	if (is_present_hf("P-Preferred-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Preferred-Identity)") && $hdr(P-Preferred-Identity) =~ "sip:.*") {
		append_hf("P-Asserted-Identity: $hdr(P-Preferred-Identity)\r\n");
	} else if (is_present_hf("P-Asserted-Identity") && pcscf_assert_identity("pcscf_location", "$hdr(P-Asserted-Identity)") && $hdr(P-Asserted-Identity) =~ "sip:.*") {
		append_hf("P-Asserted-Identity: $hdr(P-Asserted-Identity)\r\n");
	} else if (pcscf_assert_identity("pcscf_location", "$(fu{tobody.uri})")) {
		# For broken SIP implementation in Samsung devices
		if ($fu =~ "tel:.*") {
			$var(new_hdr) = $(fu{tobody.uri}) + "@NETWORKNAME";
			$var(new_hdr) = $(var(new_hdr){re.subst,/tel:/sip:/g});
			append_hf("P-Asserted-Identity: <$var(new_hdr)>\r\n");
			$fu = $var(new_hdr);
		} else {
			append_hf("P-Asserted-Identity: <$(fu{tobody.uri})>\r\n");
		}
	} else {
#!ifdef WITH_SIPP_TEST
		if (is_in_subnet("$si", "TEST_NETWORK")) {
			# SIPp/Python UE test bypass: no location entry, derive identity from From URI.
			append_hf("P-Asserted-Identity: <$(fu{tobody.uri})>\r\n");
		} else {
#!endif
		append_hf("P-Asserted-Identity: <$pcscf_asserted_identity>\r\n");
#!ifdef WITH_SIPP_TEST
		}
#!endif
	}

	if (!pcscf_follows_service_routes("pcscf_location")){
		#Variant 1 - deny access to the network
		#send_reply("400","Bad Request - Not following indicated service routes");
		#break;

		#Variant 2 - enforce routes and let the dialog continue
		pcscf_force_service_routes("pcscf_location");
	}

	# add IBCF/THIG route here if required
	# Check for "sec-agree" in the Require header:
	if (is_present_hf("Require") && $hdr(Require) =~ ".*sec-agree.*") {
		# Remove the old Require-Header:
		remove_hf("Require");
		# Replace ", sec-agree" with ""
		$var(new_hdr) = $(hdr(Require){re.subst,/[, ]*sec-agree//gi});
		if ($(var(new_hdr){s.len}) > 0) {
			append_hf("Require: $var(new_hdr)\r\n");
		}
	}

	# Check for "sec-agree" in the Proxy-Require header:
	if (is_present_hf("Proxy-Require") && $hdr(Proxy-Require) =~ ".*sec-agree.*") {
		# Remove the old Proxy-Require-Header:
		remove_hf("Proxy-Require");
		# Replace ", sec-agree" with ""
		$var(new_hdr) = $(hdr(Proxy-Require){re.subst,/[, ]*sec-agree//gi});
		if ($(var(new_hdr){s.len}) > 0) {
			append_hf("Proxy-Require: $var(new_hdr)\r\n");
		}
	}
	remove_hf("Security-Verify");

#!ifdef TRF_FUNCTION
	$var(trf) = TRF_FUNCTION;
	# Check for "sec-agree" in the Proxy-Require header:
	if (is_present_hf("Feature-Caps")) {
		# Remove the old Proxy-Require-Header:
		remove_hf("Feature-Caps");
		append_hf("Feature-Caps: $hdr(Feature-Caps);+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
	} else {
		append_hf("Feature-Caps: *;+g.3gpp.trf=\"<sip:$var(trf);lr>\"\r\n");
	}
#!endif
	# Add a visited Network-ID-Header:
	if (is_present_hf("P-Visited-Network-ID")) {
		$var(new_hdr) = "NETWORKNAME, "+$hdr(P-Visited-Network-ID);
		append_hf("P-Visited-Network-ID: $var(new_hdr)\r\n");
	} else {
		append_hf("P-Visited-Network-ID: NETWORKNAME\r\n");
	}
	set_dlg_profile("orig");
	
	# -------- IMS ORIGIN DETECTION --------
        if (is_method("INVITE")) {
        if (search_hf("Contact", "g\\.3gpp\\.icsi-ref", "a")) {
                $dlg_var(ims_orig)="1";
                xlog("L_INFO", "Origin is IMS UE\n");
        } else {
                xlog("L_INFO", "Origin is NON-IMS UE\n");
        }
        }

	# -------- SESSION TIMER NORMALIZATION --------
	# Samsung VoLTE phones propose Session-Expires: 3000 (50 min) for audio-only
	# calls (refresher=uac), so the first re-INVITE refresh fires at exactly 25 min.
	# If the radio link has even a brief degradation at that moment the re-INVITE
	# retransmissions (T1*64 = 32 s) exhaust before the radio recovers, the UE
	# receives no 200 OK, and sends BYE — ending the call.  Conference ViLTE works
	# fine because Samsung proposes ~1800 s for video calls, giving 15-min refresh
	# intervals that fall in quiet radio windows.
	#
	# Fix: cap Session-Expires at 1800 s on every outgoing initial INVITE.
	# Shorter interval = more frequent refreshes = each one has a much smaller
	# probability of coinciding with a transient radio issue.
	# refresher=uac is preserved so the UE remains the refresher.
	if (is_method("INVITE") && !has_totag() && is_present_hf("Session-Expires")) {
		$var(se_val) = $(hdr(Session-Expires){s.int});
		if ($var(se_val) > 1800) {
			remove_hf("Session-Expires");
			append_hf("Session-Expires: 1800;refresher=uac\r\n");
			xlog("L_INFO", "[SESSION_TIMER] Capped Session-Expires from $var(se_val)s to 1800s (refresher=uac)\n");
		}
	}

	# -------- PRECONDITION REMOVAL --------
	route(STRIP_PRECONDITIONS);

	t_on_reply("MO_reply");
}

######################################################################
# Disable RFC 3312 / 3GPP QoS preconditions on initial INVITEs
######################################################################
# MTK-based phones ("VoLTE/WFC UA", e.g. Optimus) offer preconditions
# (a=curr:/a=des: in SDP).  The callee then answers 183 with
# "Require: 100rel, precondition" + "a=conf:qos remote sendrecv" and
# waits for the caller to confirm its resource reservation via UPDATE.
# The MTK caller never sends that UPDATE (PRACK carries no SDP either),
# so ~2.5 s after the 183 the callee aborts the call with
# "480 Temporarily Unavailable" and the phone never rings.
#
# Fix: strip the precondition machinery from the initial INVITE offer.
# Per RFC 3312 an answerer cannot introduce preconditions that were not
# present in the offer, so removing them here disables the negotiation
# end-to-end and the callee proceeds straight to 180 Ringing.  This is
# exactly the flow the Amarisoft IMS (which regenerates SDP as a B2BUA)
# produces, and both Samsung and MTK/Optimus phones handle it fine.
# Dedicated bearer setup via Rx/Gx is NOT affected - phones just no
# longer gate alerting on it.
#
# This workaround is restricted to the exact Optimus/MediaTek User-Agent.
# Samsung and other working handsets retain their original precondition flow.
route[STRIP_PRECONDITIONS] {
	if (!is_method("INVITE") || has_totag()) {
		return;
	}
	if ($ua != "VoLTE/WFC UA") {
		return;
	}

	xlog("L_INFO", "[PRECONDITION] Optimus initial INVITE selected ci=$ci ua=[$ua]\n");

	# Strip the "precondition" option-tag from the Require header:
	if (is_present_hf("Require") && $hdr(Require) =~ ".*precondition.*") {
		$var(new_hdr) = $(hdr(Require){re.subst,/[, ]*precondition//gi}{re.subst,/^[, ]+//});
		remove_hf("Require");
		if ($(var(new_hdr){s.len}) > 0) {
			append_hf("Require: $var(new_hdr)\r\n");
		}
	}

	# Strip the "precondition" option-tag from the Supported header:
	if (is_present_hf("Supported") && $hdr(Supported) =~ ".*precondition.*") {
		$var(new_hdr) = $(hdr(Supported){re.subst,/[, ]*precondition//gi}{re.subst,/^[, ]+//});
		remove_hf("Supported");
		if ($(var(new_hdr){s.len}) > 0) {
			append_hf("Supported: $var(new_hdr)\r\n");
		}
	}

	# Strip the RFC 3312 precondition status lines from the SDP offer.
	# Only curr/des/conf attributes are touched; the rest of the SDP
	# (codecs, bandwidth, DTMF, hold/resume re-INVITEs) is untouched.
	#
	# The sdpops deletions MUST be materialised with msg_apply_changes() HERE,
	# before rtpengine_manage() (route NATMANAGE, later in the MO/MT path)
	# rewrites the SDP body.  rtpengine passes unknown a= lines through
	# unchanged and replaces the body with its own version, which would
	# otherwise re-introduce the a=curr/des/conf lines and discard the sdpops
	# deletions - exactly the split observed before this fix (the Supported/
	# Require header strip survived, the SDP lines did not).  Guarded on a
	# precondition line actually being present (a=des:) so msg_apply_changes()
	# only runs when there is something to strip, and only ever on the initial
	# INVITE (the route returns early for has_totag()).
	if (has_body("application/sdp") &&
	    sdp_get_line_startswith("$avp(precond_line)", "a=des:")) {
		sdp_remove_line_by_prefix("a=curr:");
		sdp_remove_line_by_prefix("a=des:");
		sdp_remove_line_by_prefix("a=conf:");
		msg_apply_changes();
		xlog("L_INFO", "[PRECONDITION] Stripped QoS precondition attributes from initial INVITE ($ci)\n");
	}
}
######################################################################
# Network ringback: arm playback at INVITE time
######################################################################
# play_media must be issued from a REQUEST. Kamailio swaps the tags in a reply
# route, so rtpengine gets asked to play to the far-end tag and answers "From-tag
# given, but no such tag exists" (measured, IMs_to_sip_exchange_calls_log2.pcapng
# f212/f213). The INVITE is the only request before alerting, and this route is
# called after route(NATMANAGE) so rtpengine_offer() has created the caller's tag.
#
# Self-diagnosing on purpose: the guard is set ONLY if rtpengine returned a
# duration. If it refuses to play into an offer-only call, $avp(RBT_DURATION) stays
# null, the guard stays clear, and the proven PRACK hook in route[MO_indialog] still
# runs for IMS-to-IMS. Nothing that works today can regress here.
route[MO_RBT_ARM] {
	if ("RBT_PLMN_ENV" == "00101" && is_method("INVITE") && !has_totag()
			&& $dlg_var(rbt_playing) == $null) {
		play_media("file=/mnt/rtpengine/rbt_tone.wav repeat-times=200");
		if ($avp(RBT_DURATION) != $null) {
			$dlg_var(rbt_playing) = "1";
			xlog("L_INFO", "[RBT] armed at INVITE ci=$ci ft=$ft media_duration=$avp(RBT_DURATION)ms\n");
		} else {
			xlog("L_INFO", "[RBT] play_media refused at INVITE ci=$ci - falling back to the PRACK hook\n");
		}
	}
}

######################################################################
# Replies to Originating Initial Requests
######################################################################
onreply_route[MO_reply] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");
	if (is_present_hf("C-Params")) {
		remove_hf("Contact");
		remove_hf("C-Params");
		append_hf("Contact: $ct;$hdr(C-Params)\r\n");
	}
#!ifdef WITH_N5
	# Terminating N5 AppSession after error response.
	if (status=~"[45][0-9][0-9]") {
		xnotice("Received error response for the call. Going to terminate N5 Session\n");
		route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]")
		route(NATMANAGE);

	# RFC 5009: without this the UE mutes the early media it is being sent. RSeq is
	# deliberately not required -- some exchanges send an unreliable 183 with SDP.
	if ("RBT_PLMN_ENV" == "00101" && t_check_status("183") && has_body("application/sdp")
			&& !is_present_hf("P-Early-Media")) {
		append_hf("P-Early-Media: sendrecv\r\n");
		xlog("L_INFO", "[RBT] authorized early media on 183 ci=$ci\n");
	}

	# A real answer means no synthetic one is needed. Without this, an exchange that
	# sends 183+SDP and then a bare 180 would get c=0.0.0.0 injected over the top of
	# the established answer, killing audio.
	if (t_check_status("183|200") && has_body("application/sdp")) {
		$dlg_var(rbt_answered) = "1";
	}

	# SIP exchanges answer with a bare 180, so the caller has no media session and
	# drops the tone. Attach a minimal answer and let rtpengine rewrite it to its own
	# address; the real SDP in the 200 OK re-answers and corrects the far leg.
	# Non-IMS callee = no +g.3gpp.icsi-ref on the Contact, so IMS calls never match.
	if ("RBT_PLMN_ENV" == "00101" && t_check_status("180") && !has_body("application/sdp")
			&& !search_hf("Contact", "g\\.3gpp\\.icsi-ref", "a")
			&& $dlg_var(rbt_answered) == $null) {
		$dlg_var(rbt_answered) = "1";
		set_body("v=0\r\no=- 0 0 IN IP4 0.0.0.0\r\ns=-\r\nc=IN IP4 0.0.0.0\r\nt=0 0\r\nm=audio 1 RTP/AVP 110\r\na=rtpmap:110 AMR-WB/16000\r\na=fmtp:110 octet-align=1;mode-change-capability=2;max-red=0\r\na=sendrecv\r\na=ptime:20\r\n", "application/sdp");
		# rtpengine reads the pre-change body, so the flush must come first.
		msg_apply_changes();
		rtpengine_answer("replace-origin replace-session-connection ICE=remove RTP/AVP");
		if (!is_present_hf("P-Early-Media")) {
			append_hf("P-Early-Media: sendrecv\r\n");
		}
		xlog("L_INFO", "[RBT] synthetic answer + early media on 180 (non-IMS callee) ci=$ci\n");
	}

	# Skip Rx if origin was NON-IMS (Zoiper case fix)
	if ($dlg_var(ims_orig) != "1") {
    	xlog("L_INFO", "Skipping MO Rx — Non-IMS origin\n");
    	exit;
	}

	# The synthetic 180 answer above is not worth an Rx AAR: rtpengine rewrites the m=
	# port but not our c=, so the TFT is built from 0.0.0.0 and installs 0 filters --
	# measured, and the tone is audible anyway over the default bearer. Authorizing it
	# would also cost a second AAR, since c= changes at the 200 OK and RX_MEDIA_DEDUP
	# cannot suppress it. See [[open5gs-tft-append-only]] for why that headroom matters.
	if (t_check_status("180|183|200") && has_body("application/sdp")
			&& !(t_check_status("180") && $dlg_var(rbt_answered) == "1")) {
		xlog("L_INFO", "IMS SIP client DOING RX IN MO\n");
		if (t_is_retr_async_reply()) {
			xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
			drop();
		}
		$avp(FTAG_CUSTOM_AVP)=$ft;
		$avp(TTAG_CUSTOM_AVP)=$tt;
		$avp(CALLID_CUSTOM_AVP)=$ci;

#!ifdef WITH_RX
		xlog("L_DBG", "IMS: Received 183/200 inside orig_initial_reply\n");
		xlog("L_DBG","Diameter: Orig authorizing media via Rx\n");
		if (Rx_AAR("MO_aar_reply","orig","",-1) == 0) {
			exit;
		}
#!endif
#!ifdef WITH_N5
		route(MO_N5_CALL_PCF_POLICY_AUTH);
#!endif
	}
}

#!ifdef WITH_RX
route[MO_aar_reply]
{
	# Check reply AVP since the operation is async
	switch ($avp(s:aar_return_code)) {
		case 1:
			xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
			break;
		default:
			xlog("L_WARN", "IMS: Initial AAR failed Orig (non-fatal, call continues; QoS tests must verify bearer setup)\n");
			xlog("L_WARN", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
			xlog("L_WARN", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
			xlog("L_WARN", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
			break;
	}
}
#!endif

######################################################################
# In-Dialog-Mo-Requests
######################################################################
route[MO_indialog] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

#!ifdef WITH_N5
	# Terminating N5 AppSession after BYE/CANCEL.
	if (is_method("BYE|CANCEL")) {
		xnotice("InDialog Call End/Cancel/Error. Terminating N5 QoS Session\n");
		route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

	setflag(FLT_MOBILE_ORIG);
	t_on_reply("MO_indialog_reply");

	# Network ringback, FALLBACK ARM. route[MO_RBT_ARM] normally wins at INVITE time,
	# so in practice this does not run -- verified 2026-08-28, the logs show "armed at
	# INVITE" and never "armed on PRACK". It stays as the safety net for the case where
	# rtpengine refuses to play into an offer-only call, since the PRACK is the next
	# request after the offer is answered. Both hooks share the stop-on-ACK below.
	if ("RBT_PLMN_ENV" == "00101" && is_method("PRACK") && $dlg_var(rbt_playing) == $null) {
		$dlg_var(rbt_playing) = "1";
		play_media("file=/mnt/rtpengine/rbt_tone.wav repeat-times=200");
		xlog("L_INFO", "[RBT] armed on PRACK ci=$ci ft=$ft media_duration=$avp(RBT_DURATION)ms\n");
	}
	if (is_method("ACK") && $dlg_var(rbt_playing) == "1") {
		$dlg_var(rbt_playing) = "0";
		stop_media();
		xlog("L_INFO", "[RBT] stopped on ACK ci=$ci\n");
	}
	# ---- END NETWORK RINGBACK ----

	# Append rport only if its a request coming from UE
	if (is_request() && ($hdrc(Via) == 1)) {
		force_rport();
	}

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
}

onreply_route[MO_indialog_reply] {
	xnotice("Destination URI: $du\n Request URI: $ru\n");
	xnotice("Source IP and Port: ($si:$sp)\n Route-URI: $route_uri\n");
	xnotice("Received IP and Port: ($Ri:$Rp)\n");
	xnotice("Next hop domain: ($nh(d))\n");
	xnotice("Contact header: $ct\n");

#!ifdef WITH_N5
	# Terminating N5 AppSession after error response.
	if (status=~"[45][0-9][0-9]") {
		xnotice("Received error response for the call. Going to terminate N5 Session\n");
		route(MO_N5_CALL_PCF_POLICY_AUTH_DELETE);
	}
#!endif

#!ifdef WITH_IPSEC
	sht_lock("ipsec_clients=>ipsec_clients_lock");
	if ($nh(d) != $null && $sht(ipsec_clients=>$nh(d)) != $null) {
		# IPSec forward only if its an IPsec client
		ipsec_forward("pcscf_location", IPSEC_FORWARD_FLAGS);
	}
	sht_unlock("ipsec_clients=>ipsec_clients_lock");
#!endif
	# In case of 1xx and 2xx do NAT
	if(status=~"[12][0-9][0-9]")
		route(NATMANAGE);

	# Skip Rx if origin was NON-IMS
	if ($dlg_var(ims_orig) != "1") {
    	xlog("L_INFO", "Skipping MO Rx — Non-IMS origin\n");
    	exit;
	}
	xlog("L_INFO", "IMS SIP client DOING RX in MO\n");
	# Rx AAR for in-dialog requests with SDP or Session refresh via UPDATE
	if ((t_check_status("180|183|200") && has_body("application/sdp") && !is_method("PRACK")) || (is_method("UPDATE"))) {
		if (t_is_retr_async_reply()) {
			xlog("L_DBG", "Dropping retransmitted reply which is still currently suspended\n");
			drop();
		}
		$avp(FTAG_CUSTOM_AVP)=$ft;
		$avp(TTAG_CUSTOM_AVP)=$tt;
		$avp(CALLID_CUSTOM_AVP)=$ci;

#!ifdef WITH_RX
		xlog("L_DBG", "IMS: ORIG_SUBSEQUENT reply. This is a 200 OK to a re-INVITE\n");
		xlog("L_DBG","Diameter: Orig authorizing media via Rx\n");
		# Rx AAR for in-dialog requests with SDP or Session refresh via UPDATE
		if (Rx_AAR("MO_indialog_aar_reply","orig","",-1) == 0) {
			exit;
		}
#!endif
#!ifdef WITH_N5
		route(MO_N5_CALL_PCF_POLICY_AUTH);
#!endif
	}
}

#!ifdef WITH_RX
route[MO_indialog_aar_reply]
{
	# Check reply AVP since the operation is async
	switch ($avp(s:aar_return_code)) {
	case 1:
		xlog("L_DBG", "Diameter: Orig AAR success on media authorization\n");
		break;
	default:
		xlog("L_WARN", "IMS: In-dialog AAR failed Orig (non-fatal, call continues)\n");
		xlog("L_WARN", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
		xlog("L_WARN", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
		xlog("L_WARN", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
	}
}
#!endif

#!ifdef WITH_N5
route[MO_N5_CALL_PCF_POLICY_AUTH] {
	# Send N5 PCF policy authorization only on replies.
	if (!is_reply()) {
		return;
	}
	$var(contact_uri) = $T_req($(ct{nameaddr.uri}));
	$var(ue_ip) = $(var(contact_uri){uri.host});
	$var(app_session) = 0;
	sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
	if ($sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) != $null) {
		$var(app_session) = $sht(ue_ip_to_call_app_session_map=>$var(ue_ip));
		# Update again so that Hash table does not remove the entry upon session timer expiry.
		$sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $var(app_session);
		sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
		$sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $var(app_session) + ";" + $var(ue_ip);
		sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
	}
	sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
	# Send N5 PCF policy authorization if SDP body is present.
	if (!has_body("application/sdp")) {
		return;
	}
	$var(req_sdp) = $T_req($sdp(body));
	$var(rep_sdp) = $sdp(body);
	xlog("L_DBG","Req SDP: $var(req_sdp)\n");
	xlog("L_DBG","Rep SDP: $var(rep_sdp)\n");

	$var(current_media) = "";
	$var(req_audio_rtp_port) = 0;
	$var(req_audio_rtcp_port) = 0;
	$var(req_video_rtp_port) = 0;
	$var(req_video_rtcp_port) = 0;
	$var(req_audio_rtcp_explicit) = 0;
	$var(req_video_rtcp_explicit) = 0;
	$var(audio_bw_as) = 0;
	$var(video_bw_as) = 0;

	# Split SDP into lines and iterate.
	$var(req_sdp_lines_count) = $(var(req_sdp){line.count});
	$var(req_sdp_line_num) = 0;
	while ($var(req_sdp_line_num) < $var(req_sdp_lines_count)) {
		$var(sdp_line) = $(var(req_sdp){line.at,$var(req_sdp_line_num)});
		# Check for audio media line: "m=audio <port>".
		if ($var(sdp_line) =~ "^m=audio ") {
			$var(current_media) = "audio";
			$var(req_audio_rtp_port) = $(var(sdp_line){s.select,1, });
		}
		# Check for video media line: "m=video <port>".
		else if ($var(sdp_line) =~ "^m=video ") {
			$var(current_media) = "video";
			$var(req_video_rtp_port) = $(var(sdp_line){s.select,1, });
		}
		# Check for explicit RTCP attribute: "a=rtcp:<port>".
		else if ($var(sdp_line) =~ "^a=rtcp:") {
			if ($var(current_media) == "audio") {
				$var(req_audio_rtcp_port) = $(var(sdp_line){s.substr,7,0});
				$var(req_audio_rtcp_explicit) = 1;
			} else if ($var(current_media) == "video") {
				$var(req_video_rtcp_port) = $(var(sdp_line){s.substr,7,0});
				$var(req_video_rtcp_explicit) = 1;
			}
		}
		# Check for bandwidth information.
		else if ($var(sdp_line) =~ "^b=AS:") {
			if ($var(current_media) == "audio") {
				$var(audio_bw_as) = $(var(sdp_line){s.substr,5,0});
			} else if ($var(current_media) == "video") {
				$var(video_bw_as) = $(var(sdp_line){s.substr,5,0});
			}
		}
		$var(req_sdp_line_num) = $var(req_sdp_line_num) + 1;
	}

	# Fallback: RTCP = RTP + 1 (RFC 3550 default) if no explicit a=rtcp.
	if ($var(req_audio_rtcp_explicit) != 1 && $var(req_audio_rtp_port) > 0) {
		$var(req_audio_rtcp_port) = $(var(req_audio_rtp_port){s.int}) + 1;
	}
	if ($var(req_video_rtcp_explicit) != 1 && $var(req_video_rtp_port) > 0) {
		$var(req_video_rtcp_port) = $(var(req_video_rtp_port){s.int}) + 1;
	}

	$var(current_media) = "";
	$var(rep_audio_rtp_port) = 0;
	$var(rep_audio_rtcp_port) = 0;
	$var(rep_video_rtp_port) = 0;
	$var(rep_video_rtcp_port) = 0;
	$var(rep_audio_rtcp_explicit) = 0;
	$var(rep_video_rtcp_explicit) = 0;
	# Split SDP into lines and iterate.
	$var(rep_sdp_lines_count) = $(var(rep_sdp){line.count});
	$var(rep_sdp_line_num) = 0;
	while ($var(rep_sdp_line_num) < $var(rep_sdp_lines_count)) {
		$var(sdp_line) = $(var(rep_sdp){line.at,$var(rep_sdp_line_num)});
		# Check for audio media line: "m=audio <port>".
		if ($var(sdp_line) =~ "^m=audio ") {
			$var(current_media) = "audio";
			$var(rep_audio_rtp_port) = $(var(sdp_line){s.select,1, });
		}
		# Check for video media line: "m=video <port>".
		else if ($var(sdp_line) =~ "^m=video ") {
			$var(current_media) = "video";
			$var(rep_video_rtp_port) = $(var(sdp_line){s.select,1, });
		}
		# Check for explicit RTCP attribute: "a=rtcp:<port>".
		else if ($var(sdp_line) =~ "^a=rtcp:") {
			if ($var(current_media) == "audio") {
				$var(rep_audio_rtcp_port) = $(var(sdp_line){s.substr,7,0});
				$var(rep_audio_rtcp_explicit) = 1;
			} else if ($var(current_media) == "video") {
				$var(rep_video_rtcp_port) = $(var(sdp_line){s.substr,7,0});
				$var(rep_video_rtcp_explicit) = 1;
			}
		}
		# Check for bandwidth information.
		else if ($var(sdp_line) =~ "^b=AS:") {
			if ($var(current_media) == "audio") {
				$var(audio_bw_as) = $(var(sdp_line){s.substr,5,0});
			} else if ($var(current_media) == "video") {
				$var(video_bw_as) = $(var(sdp_line){s.substr,5,0});
			}
		}
		$var(rep_sdp_line_num) = $var(rep_sdp_line_num) + 1;
	}

	# Fallback: RTCP = RTP + 1 (RFC 3550 default) if no explicit a=rtcp.
	if ($var(rep_audio_rtcp_explicit) != 1 && $var(rep_audio_rtp_port) > 0) {
		$var(rep_audio_rtcp_port) = $(var(rep_audio_rtp_port){s.int}) + 1;
	}
	if ($var(rep_video_rtcp_explicit) != 1 && $var(rep_video_rtp_port) > 0) {
		$var(rep_video_rtcp_port) = $(var(rep_video_rtp_port){s.int}) + 1;
	}

	$var(req_sdp_ip) = $(var(req_sdp){line.sw,c=IN}{s.select,2, });
	$var(rep_sdp_ip) = $sdp(c:ip);

	xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio RTP: $var(req_audio_rtp_port), RTCP: $var(req_audio_rtcp_port)\n");
	xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio RTP: $var(rep_audio_rtp_port), RTCP: $var(rep_audio_rtcp_port)\n");
	if ($var(req_video_rtp_port) > 0) {
		xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Video RTP: $var(req_video_rtp_port), RTCP: $var(req_video_rtcp_port)\n");
	} else {
		xlog("L_INFO", "Request SDP Parse Result from $var(req_sdp_ip) - Audio only (no video)\n");
	}
	if ($var(rep_video_rtp_port) > 0) {
		xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Video RTP: $var(rep_video_rtp_port), RTCP: $var(rep_video_rtcp_port)\n");
	} else {
		xlog("L_INFO", "Reply SDP Parse Result from $var(rep_sdp_ip) - Audio only (no video)\n");
	}

	$var(audio_media_component_body) = '"0": {
		"medCompN": 1,
		"qosReference": "qosVoNR",
		"medType": "AUDIO",
		"codecs": [
			"downlink\n0\n",
			"uplink\n0\n"
		],
		"medSubComps": {
			"0": {
				"fNum": 1,
				"fDescs": [
					"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
					"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
					"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '",
					"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '"
				],
				"fStatus": "ENABLED",
				"marBwDl": "' + $var(audio_bw_as) + ' Kbps",
				"marBwUl": "' + $var(audio_bw_as) + ' Kbps",
				"flowUsage": "NO_INFO"
			}
		}
	}';
	# Callee → Caller.
	# TODO: Handle calling between a SIP client and VoLTE/VoNR UE.
	if (($fU != $null && is_in_profile("callee", "$fU") && !is_in_profile("as", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
		$var(audio_media_component_body) = '"0": {
			"medCompN": 1,
			"qosReference": "qosVoNR",
			"medType": "AUDIO",
			"codecs": [
				"downlink\n0\n",
				"uplink\n0\n"
			],
			"medSubComps": {
				"0": {
					"fNum": 1,
					"fDescs": [
						"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + '",
						"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtp_port) + '",
						"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + '",
						"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_audio_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_audio_rtcp_port) + '"
					],
					"fStatus": "ENABLED",
					"marBwDl": "' + $var(audio_bw_as) + ' Kbps",
					"marBwUl": "' + $var(audio_bw_as) + ' Kbps",
					"flowUsage": "NO_INFO"
				}
			}
		}';
	}

	$var(video_media_component_body) = "";
	# NOTE: Only if both request and reply SDPs have video media, we consider video for policy authorization and include it in the media components. This is to handle the case where one side doesn't support video and hence doesn't include it in the SDP at all.
	if ($var(req_video_rtp_port) > 0 && $var(rep_video_rtp_port) > 0) {
		$var(video_media_component_body) = '"1": {
			"medCompN": 2,
			"qosReference": "qosVoNR",
			"medType": "VIDEO",
			"codecs": [
				"downlink\n0\n",
				"uplink\n0\n"
			],
			"medSubComps": {
				"0": {
					"fNum": 2,
					"fDescs": [
						"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
						"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
						"permit out 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '",
						"permit in 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '"
					],
					"fStatus": "ENABLED",
					"marBwDl": "' + $var(video_bw_as) + ' Kbps",
					"marBwUl": "' + $var(video_bw_as) + ' Kbps",
					"flowUsage": "NO_INFO"
				}
			}
		}';
		# Callee → Caller.
		# TODO: Handle calling between a SIP client and VoLTE/VoNR UE.
		if (($fU != $null && is_in_profile("callee", "$fU") && !is_in_profile("as", "$fU")) || ($tU != $null && is_in_profile("caller", "$tU"))) {
			$var(video_media_component_body) = '"1": {
				"medCompN": 2,
				"qosReference": "qosVoNR",
				"medType": "VIDEO",
				"codecs": [
					"downlink\n0\n",
					"uplink\n0\n"
				],
				"medSubComps": {
					"0": {
						"fNum": 2,
						"fDescs": [
							"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + '",
							"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtp_port) + '",
							"permit out 17 from ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + ' to ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + '",
							"permit in 17 from ' + $var(rep_sdp_ip) + ' ' + $var(rep_video_rtcp_port) + ' to ' + $var(req_sdp_ip) + ' ' + $var(req_video_rtcp_port) + '"
						],
						"fStatus": "ENABLED",
						"marBwDl": "' + $var(video_bw_as) + ' Kbps",
						"marBwUl": "' + $var(video_bw_as) + ' Kbps",
						"flowUsage": "NO_INFO"
					}
				}
			}';
		}
	}

	$var(media_components_body) = "";
	if ($var(video_media_component_body) != "") {
		$var(media_components_body) = $var(audio_media_component_body) + "," + $var(video_media_component_body);
	} else {
		$var(media_components_body) = $var(audio_media_component_body);
	}

	$var(ue_policy_authorization_body) = '{
		"ascReqData": {
			"afAppId": "+g.3gpp.icsi-ref=\"urn%3Aurn-7%3A3gpp-service.ims.icsi.mmtel\"",
			"dnn": "ims",
			"medComponents": { ' + $var(media_components_body) + ' },
			"evSubsc": {
				"events": [
					{
						"event": "QOS_NOTIF",
						"notifMethod": "PERIODIC"
					},
					{
						"event": "ANI_REPORT",
						"notifMethod": "ONE_TIME"
					}
				]
			},
			"notifUri": "http://N5_BIND_IP:N5_BIND_PORT",
			"sponStatus": "SPONSOR_DISABLED",
			"gpsi": "msisdn-' + $fU + '",
			"suppFeat": "2",
			"ueIpv4": "' + $var(ue_ip) + '"
		}
	}';
	jansson_append("obj", "", "$var(ue_policy_authorization_body)", "$var(ue_policy_authorization_json_body)");

	xlog("L_DBG", "Constructed UE policy authorization body: $var(ue_policy_authorization_json_body)\n");

	$var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
	if ($var(app_session) > 0) {
		xnotice("MT - N5 QoS Auth session already exists for UE with IP $var(ue_ip) so sending a patch request\n");

		# Set HTTP2 request headers.
		$var(headers) = "Content-Type: application/merge-patch+json\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
		$var(headers) = $var(headers) + "accept: application/json\r\n";
		$var(headers) = $var(headers) + "accept: application/problem+json\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

		http_client_request_v2pk("PATCH", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(app_session)", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)");
		switch ($rc) {
			# Success case.
			case 200:
				xlog("L_INFO", "N5 QoS Session modification successfully updated. Reason code: $rc\n");
				xlog("L_INFO", "HTTP results: $var(result)\n");
				xlog("L_INFO", "HTTP response: $rc\n");
				xlog("L_INFO", "cURL Response: $curlerror(error)\n");
				xlog("L_INFO", "Location Header header: $httprhdr(location)\n");
				break;
			# Failure case.
			default:
				xlog("L_ERR", "N5 QoS Session modification failed for UE with IP $var(ue_ip). Reason code: $rc\n");
				xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
				xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
				xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
				# Comment this if you want to allow even if authorization fails.
				if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
					dlg_terminate("all", "N5 QoS authorization (modification) failed for call");
				} else {
					send_reply("412", "N5 QoS authorization (modification) failed for call");
				}
				exit;
		}
	} else {
		xlog("L_INFO","MT - Creating N5 QoS Auth session for UE with IP $var(ue_ip)\n");

		$var(headers) = "Content-Type: application/json\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
		$var(headers) = $var(headers) + "accept: application/json\r\n";
		$var(headers) = $var(headers) + "accept: application/problem+json\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
		$var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

		xlog("L_INFO","SIP Call. Sending N5 QoS Auth for $fu to PCF\n");
		# Send the request to PCF.
		http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions", "$var(ue_policy_authorization_json_body)", "$var(headers)", "$var(result)" );

		switch ($rc) {
			# Success case.
			case 201:
				xlog("L_INFO", "N5 QoS Session successfully created $rc\n");
				xlog("L_INFO", "HTTP results: [$var(result)]\n");
				xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
				xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

				# Retrieve the AppSession Id out of the location Header if the resopnse is 201.
				# Example URL: "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/(someSessionID)"

				# Extract the AppSession Id.
				$var(response_url) = $httprhdr(location);
				$var(response_url) = $(var(response_url){s.trim});
				$var(app_session) = $(var(response_url){s.select,-1,/});

				# Store the AppSession Id in the hash table associated with the IP address in the last Via SIP header.
				sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
				$sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $var(app_session);
				sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
				# Store the AppSession Id in the hash table associated with the dialog Call-Id.
				sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
				$sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $var(app_session) + ";" + $var(ue_ip);
				sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
				xlog("L_INFO", "Stored call AppSession Id for IP $var(ue_ip) is $var(app_session)\n");
				break;
			# Failure case.
			default:
				xlog("L_ERR", "N5 QoS Session authorization failed for UE with IP $var(ue_ip). Reason code: $rc\n");
				xlog("L_ERR", "IMS: ttag: "+ "$avp(TTAG_CUSTOM_AVP)");
				xlog("L_ERR", "IMS: ftag: "+ "$avp(FTAG_CUSTOM_AVP)");
				xlog("L_ERR", "IMS: callid: "+ "$avp(CALLID_CUSTOM_AVP)");
				# Comment this if you want to allow even if authorization fails.
				if(dlg_get("$avp(CALLID_CUSTOM_AVP)","$avp(FTAG_CUSTOM_AVP)","$avp(TTAG_CUSTOM_AVP)")){
					dlg_terminate("all", "N5 QoS authorization failed for call");
				} else {
					send_reply("412", "N5 QoS authorization failed for call");
				}
				exit;
		}
	}
}

route[MO_N5_CALL_PCF_POLICY_AUTH_DELETE] {
	# Retrieve the AppSession Id from the hash table.
	sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
	if ($sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) == $null) {
		xlog("L_WARN", "No call AppSession found for Call-Id $ci\n");
		sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
		return;
	}
	$var(app_session_and_ue_ip) = $sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci);
	sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
	$var(app_session) = $(var(app_session_and_ue_ip){s.select,0,;});
	$var(ue_ip) = $(var(app_session_and_ue_ip){s.select,1,;});

	xlog("L_INFO", "Terminating AppSession with Id $var(app_session) for UE with IP $var(ue_ip) due to call end\n");

	$var(time_now)=$_s($timef(%a, %d %b %Y %H:%M:%S %Z));
	$var(headers) = "X-SIP-Status: Call-End-MT\r\n";
	$var(headers) = $var(headers) + "3gpp-sbi-discovery-target-nf-type: PCF\r\n";
	$var(headers) = $var(headers) + "accept: application/json\r\n";
	$var(headers) = $var(headers) + "accept: application/problem+json\r\n";
	$var(headers) = $var(headers) + "3gpp-sbi-max-rsp-time: 10000\r\n";
	$var(headers) = $var(headers) + "3gpp-sbi-discovery-service-names: npcf-policyauthorization\r\n";
	$var(headers) = $var(headers) + "3gpp-sbi-sender-timestamp: " + $var(time_now);

	$var(json_request) = "";

	http_client_request_v2pk("POST", "http://SCP_BIND_IP:SCP_BIND_PORT/npcf-policyauthorization/v1/app-sessions/$var(app_session)/delete", "$var(json_request)", "$var(headers)", "$var(result)");
	xlog("L_INFO", "CURL error: [$curlerror(error)]\n");
	xlog("L_INFO", "HTTP results: [$var(result)]\n");
	xlog("L_INFO", "HTTP response/ Return code: [$rc]\n");
	xlog("L_INFO", "Location Header: [$httprhdr(location)]\n");

	# Clear hashtable content irrespective of the response from PCF/IMS as the call has ended.
	sht_lock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
	$sht(ue_ip_to_call_app_session_map=>$var(ue_ip)) = $null;
	sht_unlock("ue_ip_to_call_app_session_map=>ue_ip_to_call_app_session_map_lock");
	sht_lock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
	$sht(mo_call_id_to_call_app_session_and_ue_ip_map=>$ci) = $null;
	sht_unlock("mo_call_id_to_call_app_session_and_ue_ip_map=>mo_call_id_to_call_app_session_and_ue_ip_map_lock");
}
#!endif
