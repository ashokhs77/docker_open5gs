#!ifdef WITH_DEBUG
loadmodule "debugger.so"
modparam("debugger", "mod_hash_size", 5)
modparam("debugger", "mod_level_mode", 1)
modparam("debugger", "mod_level", "xlog=3")
#!endif

####### Routing Logic ########
# Main SIP request routing logic
# - processing of any incoming SIP request starts with this route

route {
	xlog("L_DBG", "$rm ($fu ($si:$sp) to $tu, $ci)\n");

	# per request initial checks
	route(REQINIT);

	if (is_method("NOTIFY")) {
		route(NOTIFY);
		send_reply("202", "Accepted");
		exit;
	}

	if (!is_method("MESSAGE")) {
		append_to_reply("Allow: MESSAGE,NOTIFY\r\n");
		send_reply("405", "Method not allowed");
		exit;
	}

	if ($cT == "application/vnd.3gpp.sms") {
		route(SMS_FROM_3GPP);
	} else if ($cT == "text/plain") {
		route(SMS_FROM_SIP);
	} else {
		send_reply("488", "Content-Type not supported");
		exit;
	}
}

######################################################################
# Helper routes (Basic-Checks, NAT-Handling/RTP-Control, XML-RPC)
######################################################################
# Per SIP request initial checks
route[REQINIT] {
	# Trace this message

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483","Too Many Hops");
		exit;
	}

	if(!sanity_check("1511", "7")) {
		xlog("Malformed SIP message from $si:$sp\n");
		exit;
	}

	# Reply to OPTIONS:
	if (is_method("OPTIONS") && (uri==myself)) {
		options_reply();
		exit;
	}

	# Ignore Re-Transmits:
	if (t_lookup_request()) {
		exit;
	}
}

######################################################################
# SMS from VoLTE Handsets
######################################################################
route[SMS_FROM_3GPP] {
#!ifdef WITH_DEBUG
	xlog("L_DBG", "3GPP-SMS: $rm ($fu ($si:$sp) to $tu, $ci)\n");
	xlog("L_DBG", "SMS for $tpdu(destination) \"$tpdu(payload)\" (Valid: $tpdu(validity) )\n");
#!endif
	send_reply("202", "Accepted");

	if (isRPDATA()) {
		$uac_req(method) = "MESSAGE";
		$uac_req(ruri) = $ai;
		$uac_req(furi) = "sip:"+SMSC_SERVER;
		$uac_req(turi) = $ai;
		$uac_req(hdrs) = "Content-Type: application/vnd.3gpp.sms\r\nRequest-Disposition: no-fork\r\nAccept-Contact: *;+g.3gpp.smsip\r\n";
		$uac_req(body) = $smsack;
		uac_req_send();


		$avp(from) = $(ai{uri.user});
		$avp(to) = $tpdu(destination);
		$avp(dcs) = $tpdu(coding);

		# Debug BEFORE normalization
                xlog("L_ERR", "SMS BEFORE NORMALIZE: TO=$avp(to) FROM=$avp(from)\n");

                # Normalize FROM (add 91 if missing)
                if ($avp(from) =~ "^[0-9]{10}$") {
                $avp(from) = "91" + $avp(from);
                }

                # Normalize destination (remove 91)
                if ($avp(to) =~ "^91[0-9]{10}$") {
                $avp(to) = $(avp(to){re.subst,/^91([0-9]{10})$/\1/});
                }

                # Debug AFTER normalization
                xlog("L_ERR", "SMS AFTER NORMALIZE: TO=$avp(to) FROM=$avp(from)\n"); 		

		# Translate "To":
		dp_translate("1", "$avp(to)/$avp(to)");

		$avp(text) = $tpdu(payload);
#!ifdef WITH_DEBUG
		xlog("L_DBG", "SMS from 3GPP/VoLTE\n");
		xlog("L_DBG", "-------------------------------------\n");
		xlog("L_DBG", "FROM $avp(from)\n");
		xlog("L_DBG", "TO   $avp(to)\n");
		xlog("L_DBG", "TEXT $avp(text)\n");
		xlog("L_DBG", "DCS  $avp(dcs)\n");
#!endif
		route(SMS);
	}

	exit;
}

######################################################################
# SMS from OTT Handsets
######################################################################
route[SMS_FROM_SIP] {
	send_reply("200", "OK");

	# Prefer P-Asserted-Identity as the caller; fall back to the From URI user
	# when PAI is absent (e.g. direct SIP MESSAGE from test tools / OTT clients).
	if (is_present_hf("P-Asserted-Identity")) {
		$avp(from) = $(ai{uri.user});
	} else {
		$avp(from) = $fU;
	}

	# Translate "To":
	$avp(to) = $tU;
	$avp(text) = $rb;

	# DCS (Data Coding Scheme) is not present in plain SIP MESSAGE — default to
	# 0 (GSM 7-bit default alphabet / plain text).  Without this the SQL INSERT
	# renders the unset AVP as the literal string "<null>", which is invalid SQL
	# and causes a MySQL 1064 syntax error.
	$avp(dcs) = 0;

#!ifdef WITH_DEBUG
	xlog("L_DBG", "SMS from SIP/OTT\n");
	xlog("L_DBG", "-------------------------------------\n");
	xlog("L_DBG", "FROM $avp(from)\n");
	xlog("L_DBG", "TO   $avp(to)\n");
	xlog("L_DBG", "TEXT $avp(text)\n");
#!endif

	# Store-and-forward online trigger: the S-CSCF sends a SIP MESSAGE with body
	# "USER_ONLINE:<msisdn>" when a subscriber (re-)registers.  Flush that UE's
	# queued SMS (clear backoff + pending_ue) instead of treating it as an SMS.
	if ($avp(text)=~"^USER_ONLINE:") {
		$var(msisdn) = $(avp(text){re.subst,/^USER_ONLINE://});
		xlog("L_NOTICE", "USER_ONLINE: [$var(msisdn)] came online - checking pending_ue\n");

		sql_query("sms", "SELECT COUNT(*) FROM pending_ue WHERE callee='$var(msisdn)';", "pu");
		$var(pending_count) = $dbr(pu=>[0,0]);
		sql_result_free("pu");

		if ($var(pending_count) > 0) {
			$sht(sms_first_sub=>$var(msisdn)) = $null;
			$sht(sms_last_sub=>$var(msisdn)) = $null;
			sql_query("sms", "DELETE FROM pending_ue WHERE callee='$var(msisdn)';");
			xlog("L_DBG", "USER_ONLINE: [$var(msisdn)] removed from pending_ue - SUBSCRIBE fires next worker pass\n");
		} else {
			xlog("L_DBG", "USER_ONLINE: [$var(msisdn)] not in pending_ue - ignoring\n");
		}
	} else {
		dp_translate("1", "$avp(to)/$avp(to)");
		route(SMS);
	}

	exit;
}


######################################################################
# SMS from other networks
######################################################################
event_route[xhttp:request] {
	if ($(hu{url.querystring}{s.len}) > 0) {
		$avp(from) = $(hu{url.querystring}{param.value,msisdn,&});
		$avp(to) = $(hu{url.querystring}{param.value,to,&});
		$avp(text) = $(hu{url.querystring}{param.value,text,&}{s.replace,+,%20}{s.unescape.user});
		$avp(from_outbound) = 1;
#!ifdef WITH_DEBUG
		xlog("L_DBG", "SMS from Outbound ($hu)\n");
		xlog("L_DBG", "-------------------------------------\n");
		xlog("L_DBG", "FROM $avp(from)\n");
		xlog("L_DBG", "TO   $avp(to)\n");
		xlog("L_DBG", "TEXT $avp(text)\n");
#!endif
	if ($avp(to) == "491771782261")
		$avp(to) = "494046895124";
	if ($avp(to) == "491771782319")
		$avp(to) = "494034927220";

		route(SMS);
	}

	xhttp_reply("200", "OK", "text/html", "<html><body>OK - [$si:$sp]</body></html>");
}

######################################################################
# SMS to VoLTE Handsets
######################################################################
route[SMS_TO_3GPP] {
#!ifdef WITH_DEBUG
	xlog("L_DBG", "SMS to 3GPP/VoLTE\n");
	xlog("L_DBG", "-------------------------------------\n");
	xlog("L_DBG", "FROM $avp(from)\n");
	xlog("L_DBG", "TO   $avp(to)\n");
	xlog("L_DBG", "TEXT $avp(text)\n");
	xlog("L_DBG", "DCS  $avp(dcs)\n");
#!endif

	// Construct a new SMS-Body:
	$rpdata(all) = $null;
	$rpdata(type) = 1; // RP-DATA: Network to UE
	$rpdata(reference) = $avp(id);
	$rpdata(originator) = $avp(from);
	$tpdu(type) = 4; // SMS-Deliver
	$tpdu(origen) = $avp(from); // The Destination becomes the originator of the SMS
	$tpdu(payload) = $avp(text);
	$tpdu(coding) = $avp(dcs);

	$uac_req(method) = "MESSAGE";
	$uac_req(ruri) = "sip:"+$avp(to)+"@"+DOMAIN;
	$uac_req(furi) = "sip:"+SMSC_SERVER;
	$uac_req(turi) = "sip:"+$avp(to)+"@"+DOMAIN;
	$uac_req(hdrs) = "Content-Type: application/vnd.3gpp.sms\r\nRequest-Disposition: no-fork\r\nAccept-Contact: *;+g.3gpp.smsip\r\nX-MSG-ID: "+$avp(id)+"\r\n";
	$uac_req(body) = $smsbody;
	$uac_req(evroute)=1;
	uac_req_send();
	# sql_query("sms", "delete from messages where id=$avp(id);");
}

######################################################################
# SMS to OTT-Handsets
######################################################################
route[SMS_TO_SIP] {
#!ifdef WITH_DEBUG
	xlog("L_DBG", "SMS to SIP/OTT\n");
	xlog("L_DBG", "-------------------------------------\n");
	xlog("L_DBG", "FROM $avp(from)\n");
	xlog("L_DBG", "TO   $avp(to)\n");
	xlog("L_DBG", "TEXT $avp(text)\n");
#!endif

	$uac_req(method) = "MESSAGE";
	$uac_req(ruri) = "sip:"+$avp(to)+"@"+DOMAIN;
	$uac_req(furi) = "sip:+"+$avp(from)+"@"+DOMAIN;
	$uac_req(turi) = "sip:"+$avp(to)+"@"+DOMAIN;
	$uac_req(hdrs) = "Content-Type: text/plain\r\nX-MSG-ID: "+$avp(id)+"\r\n";
	$uac_req(evroute)=1;
	$uac_req(body) = $avp(text);

	uac_req_send();
}

######################################################################
# SMS to Outbound
######################################################################
route[SMS_TO_OUTBOUND] {
#!ifdef WITH_DEBUG
	xlog("L_DBG", "SMS to Outbound\n");
	xlog("L_DBG", "-------------------------------------\n");
	xlog("L_DBG", "FROM $avp(from)\n");
	xlog("L_DBG", "TO   $avp(to)\n");
	xlog("L_DBG", "TEXT $avp(text)\n");
#!endif
	if ($avp(from_outbound) == 1) {
		xlog("Not sending: FROM and TO Outbound!\n");
		return 1;
		exit;
	}
	if ($avp(from) == "494046895124")
		$avp(from) = "491771782261";
	if ($avp(from) == "494034927220")
		$avp(from) = "491771782319";

	http_client_query("https://rest.nexmo.com/sms/json?api_key=NEXMO_APIKEY&api_secret=NEXMO_APISECRET&from=$avp(from)&to=$avp(to)&text=$(avp(text){s.escape.user})", "$var(result)");
	if ($retcode != 200) return -1;
	json_get_field("$var(result)", "messages", "$var(messages)");
	json_get_field("$var(messages)", "status", "$var(status)");
	if ($var(status) != 0) return -1;
	return 1;
}

######################################################################
# SMS Handling
######################################################################
route[SMS] {
	# Reject malformed / non-MSISDN recipients BEFORE storing, so an undeliverable
	# number can't enter the store-and-forward retry loop (it would otherwise be
	# re-subscribed for up to 48h, flooding the I-CSCF with LIR/SUBSCRIBE failures —
	# e.g. an 8-digit mis-dial like 55757010). Accepts a 10-digit MSISDN with an
	# optional 91 country code (covers the SMS_FROM_3GPP-normalized 10-digit form and
	# an SMS_FROM_SIP 91+10-digit form); inter-NIB MSISDNs are 10-digit, so unaffected.
	if (!($avp(to) =~ "^(91)?[0-9]{10}$")) {
		xlog("L_WARN", "SMS: rejecting invalid recipient [$avp(to)] from [$avp(from)] - not a valid MSISDN\n");
		return -1;
	}

#!ifdef WITH_DEBUG
	xlog("L_DBG", "SMS-Task\n");
	xlog("L_DBG", "-------------------------------------\n");
	xlog("L_DBG", "FROM $avp(from)\n");
	xlog("L_DBG", "TO   $avp(to)\n");
	xlog("L_DBG", "TEXT $avp(text)\n");
	xlog("L_DBG", "DCS  $avp(dcs)\n");
#!endif

	# Query ENUM: Local number?
	$var(enum) = "+"+$avp(to);
	if (!enum_pv_query("$var(enum)")) {
		route(SMS_TO_OUTBOUND);
		return $retcode;
	}

	if (sql_query("sms", "insert into messages (caller, callee, text, dcs, valid) values ('$(avp(from){s.escape.common})', '$(avp(to){s.escape.common})', '$(avp(text){s.escape.common})', $avp(dcs), now());")) {
		# Track the recipient so a USER_ONLINE trigger can flush immediately on re-register
		sql_query("sms", "INSERT IGNORE INTO pending_ue (callee) VALUES ('$(avp(to){s.escape.common})');");
		xlog("L_DBG", "SMS: [$avp(to)] stored and added to pending_ue\n");
		return 1;
	} else {
		xlog("L_ERR", "SMS: Failed to store for TO=[$avp(to)] - DB may be down!\n");
		return -1;
	}
}

######################################################################
# SMS Worker - runs every 3s. Fetches all stored SMS and hands each to
# SEND_SMS, which performs delivery, SUBSCRIBE backoff and 48h expiry.
######################################################################
route[SMS_WORKER] {
	sql_query("sms", "select id, caller, callee, text, dcs, UNIX_TIMESTAMP(valid) from messages;", "q");
	if ($dbr(q=>rows) > 0) {
		xlog("L_DBG", "SMS_WORKER: Found $dbr(q=>rows) pending SMS\n");
		$var(i) = 0;
		while ($var(i) < $dbr(q=>rows)) {
			$avp(id)    = $dbr(q=>[$var(i),0]);
			$avp(from)  = $dbr(q=>[$var(i),1]);
			$avp(to)    = $dbr(q=>[$var(i),2]);
			$avp(text)  = $dbr(q=>[$var(i),3]);
			$avp(dcs)   = $dbr(q=>[$var(i),4]);
			$avp(valid) = $dbr(q=>[$var(i),5]);
			route(SEND_SMS);
			$var(i) = $var(i) + 1;
		}
	}
	sql_result_free("q");
}

######################################################################
# NOTIFY handler - original unchanged
######################################################################
route[NOTIFY] {
	if (has_body("application/reginfo+xml")) {
		reginfo_handle_notify("location");
		if ($rc == 2) {
			# All contacts of the IMPU are de-registered
			xnotice("All contacts de-registered for $fu\n");
		}
		# Send 202 Accepted response for all cases
		send_reply("202", "Accepted");
	} else {
		send_reply("503", "Invalid Content-Type");
	}
	exit;
}
######################################################################
# SEND_SMS - deliver or subscribe with backoff
######################################################################
route[SEND_SMS] {
	$var(uri) = "sip:"+$avp(to)+"@"+DOMAIN;

	# Drop messages older than 48h (172800s) and clear their backoff state. This is
	# the SINGLE notice printed for an undeliverable recipient: the per-retry SUBSCRIBE
	# attempts are silent (L_DBG) and the I-CSCF fallback logs are silenced too, so a
	# mis-dialled / never-reachable number produces exactly ONE line here at discard
	# instead of flooding for 48h. A real offline subscriber that comes back in time is
	# delivered normally before ever reaching this branch.
	$var(age) = $Ts - $avp(valid);
	if ($var(age) > 172800) {
		xlog("L_WARN", "SEND_SMS: SMS ID=[$avp(id)] to [$avp(to)] from [$avp(from)] discarded after 48h - recipient never reachable (offline or unable to route), giving up\n");
		sql_query("sms", "DELETE FROM messages WHERE id=$avp(id);");
		$sht(sms_first_sub=>$avp(to)) = $null;
		$sht(sms_last_sub=>$avp(to)) = $null;
		return;
	}

	if (reg_fetch_contacts("location", "$var(uri)", "caller")) {
		xlog("L_DBG", "SEND_SMS: Contact found for [$avp(to)] - delivering SMS ID=[$avp(id)]\n");
		$var(j) = 0;
		$var(is3gpp) = 0;
		while($var(j) < $(ulc(caller=>count))) {
			$var(k) = 0;
			while($var(k) < $(ulc(caller=>addr)[$var(j)]{param.count})) {
				if ($(ulc(caller=>addr)[$var(j)]{param.name,$var(k)}) == "+g.3gpp.smsip")
					$var(is3gpp) = 1;
				$var(k) = $var(k) + 1;
			}
			if ($var(is3gpp) == 1)
				route(SMS_TO_3GPP);
			else
				route(SMS_TO_SIP);
			$var(j) = $var(j) + 1;
		}
	} else {
		# Recipient offline - SUBSCRIBE to reg-info with an exponential backoff
		# (3s early, widening to 4h after a day) instead of every worker pass.
		if ($sht(sms_first_sub=>$avp(to)) == $null) {
			$sht(sms_first_sub=>$avp(to)) = $Ts;
		}
		$var(elapsed) = $Ts - $sht(sms_first_sub=>$avp(to));
		$var(last_sub) = $sht(sms_last_sub=>$avp(to));
		if ($var(last_sub) == $null) {
			$var(last_sub) = 0;
		}
		$var(since_last) = $Ts - $var(last_sub);
		# Backoff gap determination
		if ($var(elapsed) > 86400) {
			$var(gap) = 14400;
		} else if ($var(elapsed) > 43200) {
			$var(gap) = 7200;
		} else if ($var(elapsed) > 28800) {
			$var(gap) = 3600;
		} else if ($var(elapsed) > 18000) {
			$var(gap) = 1800;
		} else if ($var(elapsed) > 10800) {
			$var(gap) = 900;
		} else if ($var(elapsed) > 7200) {
			$var(gap) = 600;
		} else if ($var(elapsed) > 3600) {
			$var(gap) = 300;
		} else if ($var(elapsed) > 1200) {
			$var(gap) = 60;
		} else if ($var(elapsed) > 600) {
			$var(gap) = 20;
		} else if ($var(elapsed) > 300) {
			$var(gap) = 10;
		} else {
			$var(gap) = 3;
		}
		if ($var(since_last) >= $var(gap)) {
			xlog("L_DBG", "SEND_SMS: SUBSCRIBE for [$avp(to)] elapsed=[$var(elapsed)] gap=[$var(gap)]\n");
			reginfo_subscribe("$var(uri)", "SUBSCRIBE_EXPIRE");
			$sht(sms_last_sub=>$avp(to)) = $Ts;
		} else {
			xlog("L_DBG", "SEND_SMS: Skip SUBSCRIBE [$avp(to)] since_last=[$var(since_last)] < gap=[$var(gap)]\n");
		}
	}
}

######################################################################
# Local SUBSCRIBE request - add P-Asserted-Identity
######################################################################
event_route [tm:local-request] {
	if (is_method("SUBSCRIBE")) {
		append_hf("P-Asserted-Identity: $ru\r\n");
	}
}

######################################################################
# UAC Reply - delete SMS on successful delivery, reset backoff
######################################################################
event_route[uac:reply] {
	if ($uac_req(evtype) == 1) {
		if ($uac_req(evcode) == 200) {
			if ($uac_req(hdrs) != $null && $uac_req(hdrs) != "") {
				$var(msgid_hdr) = $(uac_req(hdrs){line.sw,X-MSG-ID:});
				if ($var(msgid_hdr) != $null && $var(msgid_hdr) != "") {
					$var(msgid) = $(var(msgid_hdr){s.substr,10,0}{s.int});
					xlog("L_NOTICE", "UAC_REPLY: SMS ID=[$var(msgid)] delivered successfully\n");

					# Once nothing remains for this callee, reset backoff + clear pending_ue
					sql_query("sms", "SELECT callee FROM messages WHERE id=$var(msgid);", "r");
					if ($dbr(r=>rows) > 0) {
						$var(callee) = $dbr(r=>[0,0]);
						sql_query("sms", "SELECT COUNT(*) FROM messages WHERE callee='$var(callee)' AND id != $var(msgid);", "r2");
						$var(remaining) = $dbr(r2=>[0,0]);
						sql_result_free("r2");
						if ($var(remaining) == 0) {
							$sht(sms_first_sub=>$var(callee)) = $null;
							$sht(sms_last_sub=>$var(callee)) = $null;
							sql_query("sms", "DELETE FROM pending_ue WHERE callee='$var(callee)';");
							xlog("L_DBG", "UAC_REPLY: No more pending SMS - backoff reset, [$var(callee)] removed from pending_ue\n");
						} else {
							xlog("L_DBG", "UAC_REPLY: [$var(remaining)] SMS still pending for [$var(callee)] - keeping backoff\n");
						}
					}
					sql_result_free("r");

					sql_query("sms", "DELETE FROM messages WHERE id=$var(msgid);");
					xlog("L_DBG", "UAC_REPLY: SMS ID=[$var(msgid)] deleted from messages table\n");
				} else {
					xlog("L_WARN", "UAC_REPLY: X-MSG-ID empty - cannot delete\n");
				}
			} else {
				xlog("L_DBG", "UAC_REPLY: No headers - SUBSCRIBE reply, ignoring\n");
			}
		} else {
			xlog("L_WARN", "UAC_REPLY: MESSAGE failed code=[$uac_req(evcode)] - SMS stays for retry\n");
		}
	}
}


