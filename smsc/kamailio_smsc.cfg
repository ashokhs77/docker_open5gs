modparam("sqlops", "sqlcon", SMS_DB_URL)
modparam("dialplan", "db_url", DIALPLAN_PUA_DB_URL)
modparam("uac", "restore_mode", "none")

# Backoff tracking - autoexpire 2 days
modparam("htable", "htable", "sms_first_sub=>size=8;autoexpire=172800")
modparam("htable", "htable", "sms_last_sub=>size=8;autoexpire=172800")

# SMS Worker runs every 3 seconds
modparam("rtimer", "timer", "name=sms;interval=3;mode=1;")
