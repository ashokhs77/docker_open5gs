logger:
    file:
      path: /open5gs/install/var/log/open5gs/sgwc.log

global:
  max:
    ue: MAX_NUM_UE

sgwc:
    time:
      message:
        # Match SMF's transaction window so Create Session requests are not
        # retransmitted while SMF is still waiting on Gx/PFCP under burst load.
        duration: 20000
    gtpc:
      server:
        - address: SGWC_IP
    pfcp:
      server:
        - address: SGWC_IP
      client:
        sgwu:
          - address: SGWU_IP

