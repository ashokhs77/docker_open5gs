# kannel_5g.conf - Kannel configuration for 5G SA deployment
#
# Key difference from kannel.conf (4G):
#   The smsc group uses smsc=http pointing to the Kamailio SMSC's xhttp
#   interface (port 7090, same TCP listener as SIP).
#
#   In 4G, Kannel sent MMS notification SMS via SMPP to OsmoMSC which used
#   the CS (circuit-switched) domain.  In 5G SA there is no OsmoMSC and no
#   CS domain.  The Kamailio SMSC already handles HTTP-submitted SMS via its
#   event_route[xhttp:request] block:
#     GET http://SMSC_IP:7090/?msisdn=<FROM>&to=<TO>&text=<BODY>
#
#   Kannel HTTP smsc substitution variables:
#     %p  = sender MSISDN (from-address)
#     %T  = recipient MSISDN
#     %b  = message body (URL-encoded by Kannel)
#   These map directly to the SMSC xhttp query parameter names.
#
# All other sections (core, smsbox, sendsms-user) are identical to kannel.conf.

group = core
admin-port = 13000
smsbox-port = 13001
admin-password = admin
status-password = admin
log-file = /tmp/kannel.log
log-level = 1
box-allow-ip = 127.0.0.1;MMSC_IP

group = smsbox
bearerbox-host = 127.0.0.1
sendsms-port = 13013
global-sender = 4040000001

group = sendsms-user
username = mmsc
password = mmsc123

# 5G SA SMS notification path:
#   Kannel HTTP smsc -> SMSC xhttp interface (TCP 7090) -> SIP MESSAGE -> UE
# No SMPP / OsmoMSC involved.
# 5G SA MMS notification SMS path:
# In production: Kannel would use smsc=http pointing to the Kamailio SMSC xhttp
# interface (port 7090) which handles HTTP SMS requests via event_route[xhttp:request].
# The send-url would be: http://SMSC_IP:7090/?msisdn=%p&to=%T&text=%b
#
# For lab/development use: smsc=fake allows Kannel to start without a real SMS
# gateway. MMS content delivery over PDU session is fully tested; SMS notification
# delivery to real UEs requires a production SMPP/HTTP gateway.
# To switch to real delivery, replace smsc=fake with the http block above.
group = smsc
smsc = fake
smsc-id = fake-5g-smsc
port = 13030
connect-allow-ip = *

