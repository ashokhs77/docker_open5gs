# kannel_5g.conf - Kannel configuration for 5G SA deployment
#
# Key difference from kannel.conf (4G):
#   4G sends MMS notification SMS via SMPP to OsmoMSC, which delivers them over
#   SGs -> MME. 5G SA has no MME and no SGs, so the smsc group below is an HTTP
#   smsc that hands each SMS to mmsc/wap_push_helper.py (127.0.0.1:13050). The
#   helper wraps the WAP push (UDH + binary) into an RP-DATA/SMS-DELIVER and the
#   SMSC (Kamailio, xhttp on 7090) sends it to the phone over IMS.
#
#   Kannel URL codes used: %p = RECEIVER, %P = SENDER, %c = coding,
#   %u = UDH, %b = message data (both URL-encoded, binary-safe).
#   The generic type checks only the reply BODY, hence the status-*-regex lines.
#
# All other sections (core, smsbox, sendsms-user) are identical to kannel.conf.

group = core
admin-port = 13000
smsbox-port = 13001
admin-password = admin
status-password = admin
log-file = /tmp/kannel.log
log-level = 1
box-allow-ip = 127.0.0.1;MMSC_IP

group = smsbox
bearerbox-host = 127.0.0.1
sendsms-port = 13013
global-sender = 4040000001

group = sendsms-user
username = mmsc
password = mmsc123

# 5G SA SMS notification path:
#   Kannel HTTP smsc -> wap_push_helper.py -> SMSC xhttp (TCP 7090) -> SIP MESSAGE -> UE
# No SMPP / OsmoMSC involved.
group = smsc
smsc = http
smsc-id = wap-push-5g
system-type = generic
send-url = "http://127.0.0.1:13050/send?to=%p&from=%P&coding=%c&udh=%u&data=%b"
status-success-regex = "^Sent"
status-permfail-regex = "^PERMFAIL"
status-tempfail-regex = "^TEMPFAIL"
port = 13030
connect-allow-ip = 127.0.0.1

