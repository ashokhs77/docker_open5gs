logger:
    file:
      path: /open5gs/install/var/log/open5gs/mme.log

global:
  max:
    ue: MAX_NUM_UE

mme:
    freeDiameter: /open5gs/install/etc/freeDiameter/mme.conf
    s1ap:
      server:
        - dev: MME_IF
    gtpc:
      server:
        - dev: MME_IF
      client:
        sgwc:
          - address: SGWC_IP
        smf:
          - address: SMF_IP
    sgsap:
      client:
        - address: OSMOMSC_IP
          local_address: MME_IP
          map:
            tai:
              plmn_id:
                mcc: MCC
                mnc: MNC
              tac: TAC
            lai:
              plmn_id:
                mcc: MCC
                mnc: MNC
              lac: 1
    gummei: 
      - plmn_id:
          mcc: MCC
          mnc: MNC
        mme_gid: 2
        mme_code: 1
    tai:
      - plmn_id:
          mcc: MCC
          mnc: MNC
        tac: TAC
    security:
        integrity_order : [ EIA2, EIA1, EIA0 ]
        ciphering_order : [ EEA0, EEA1, EEA2 ]
    network_name:
        full: Lekha Wireless
    mme_name: open5gs-mme0
    metrics:
      server:
        - address: MME_IP
          port: 9091
    eir:
      enabled: True
      allowed_states: [ WHITELIST, BLACKLIST, GREYLIST ]
    time:
      message:
        # Match SGW-C/SMF transaction window so burst attaches do not trigger
        # premature S11 Create Session retransmits while PFCP/session work is
        # still completing under load.
        duration: 20000
      t3412:
        # Periodic TAU interval.  3GPP TS 24.008 default is 54 minutes (3240 s).
        # The original value of 540 s (9 min) caused excessive periodic TAU
        # traffic on MME under load.  3240 s is the correct production value
        # and reduces MME background load with no negative impact on real UEs.
        # NOTE: t3450 / t3460 / t3470 are intentionally NOT set here.
        # They default to 6000 ms in Open5GS which is the correct 3GPP value.
        # Raising them is not production-safe (breaks UE error recovery timing).
        value: 3240

